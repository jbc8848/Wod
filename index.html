function stageHtml(st){
  var h = '<div class="backbar"><button class="back-btn">\u2039 Étapes</button>'
    +'<span class="ttl">J'+st.day+' \u00b7 '+st.dstr+'</span></div>';
  h += '<div class="card"><h2><small>Étape '+st.rideNo+' sur '+RUN.rideDays+'</small>'+esc(st.from.n)+' \u2192 '+esc(st.to.n)+'</h2>'
    + statHtml(st);

  /* ---- la seule variation quotidienne : plus court / normal / plus long ---- */
  var ck = 'd'+st.day;
  var cur = STATE.days[ck]===-1 ? -1 : (STATE.days[ck]===1 ? 1 : 0);
  var chain = st.chain, cum = st.cum;
  /* L'option retenue correspond à l'étape en cours : on affiche sa distance
     RÉELLE (celle du routage), la même que dans l'encart du haut. Les deux
     autres options ne sont pas routées : ce sont des estimations, marquées
     « ≈ » pour qu'aucun chiffre ne se contredise à l'écran. */
  var iTo = chain.indexOf(st.to);
  var rk = realKm(st);
  function optLabel(idx){
    if(idx==null) return null;
    var i0 = chain.indexOf(st.from);
    var est = Math.round(cum[idx]-cum[i0]);
    if(idx===iTo && rk!==null){ return {km:rk, n:chain[idx].n, exact:true}; }
    return {km:est, n:chain[idx].n, exact:false};
  }
  function optTxt(o){
    if(!o) return null;
    return (o.exact ? '' : '\u2248 ') + o.km + ' km \u00b7 ' + o.n;
  }
  var oc = optLabel(st.opts.court), on2 = optLabel(st.opts.normal), ol = optLabel(st.opts.long);
  /* --- validation / correction de la journée : toujours accessible --- */
  var doneName = STATE.done['d'+st.day] || null;
  var i0 = st.chain.indexOf(st.from);
  var alts = [];
  for(var q=i0+1; q<st.chain.length; q++){
    var dk = st.cum[q]-st.cum[i0];
    if(dk > 100) break;
    alts.push({i:q, n:st.chain[q].n, km:Math.round(dk)});
  }
  /* Le réglage « longueur du jour » n'a plus de sens une fois la journée
     faite : c'est la correction du lieu de nuit qui prend le relais. */
  if(!doneName){
  h += '<div class="vbox"><h4>Longueur de cette journée</h4>'
    +'<div class="seg">'
    + (oc
        ? ('<button class="dch'+(cur===-1?' on':'')+'" data-day="'+st.day+'" data-c="-1">Plus court'
           +'<b>'+optTxt(oc)+'</b></button>')
        /* Aucun village ne convient : plutôt que « indisponible », on propose
           de désigner soi-même le point d'arrêt sur la carte. */
        : ('<button class="dch pickalt" data-day="'+st.day+'" data-stage="'+st.id+'">Plus court'
           +'<b>\ud83d\udccd à choisir</b></button>'))
    +'<button class="dch'+(cur===0?' on':'')+'" data-day="'+st.day+'" data-c="0">Normal'
      +'<b>'+(on2?optTxt(on2):'\u2014')+'</b></button>'
    + (ol
        ? ('<button class="dch'+(cur===1?' on':'')+'" data-day="'+st.day+'" data-c="1">Plus long'
           +'<b>'+optTxt(ol)+'</b></button>')
        : ('<button class="dch pickalt" data-day="'+st.day+'" data-stage="'+st.id+'">Plus long'
           +'<b>\ud83d\udccd à choisir</b></button>'))
    +'</div>';
  h += '</div>';
  }
  var passe = (st.day <= (RUN.lastDoneDay||0) + 1);
  h += '<div class="vbox"><h4>'+(passe ? 'Où avez-vous dormi ce soir-là ?' : 'Arrivée de cette journée')+'</h4>';
  if(doneName){
    /* Une journée validée reste corrigeable : erreur de saisie, ou décision
       d'avancer plus loin le même jour. Le reste du séjour se recalcule. */
    h += '<p class="okmsg">\u2713 '+esc(st.to.n)+' \u00b7 '+kmLabel(st)+'</p>'
      +'<p class="muted" style="font-size:.78rem;margin-top:8px">Corriger le lieu de nuit :</p>'
      +'<div class="addrow" style="margin-top:5px">'
      +'<select class="done-sel" data-day="'+st.day+'">'
      + alts.map(function(a){
          var exact = (a.i===iTo && rk!==null);
          return '<option value="'+a.i+'"'+(a.i===iTo?' selected':'')+'>'+esc(a.n)+' \u00b7 '
            +(exact?'':'\u2248 ')+(exact?rk:a.km)+' km</option>'; }).join('')
      +'</select><button class="valid-other" data-day="'+st.day+'">Corriger</button></div>'
      +'<div class="btn-row"><button class="pickmap-btn" data-day="'+st.day+'" data-stage="'+st.id+'">\ud83d\udccd Choisir un point sur la carte</button></div>'
      +'<div class="btn-row"><button class="unvalid-btn" data-day="'+st.day+'">\u21ba Annuler cette validation</button></div>';
  }else{
    h += '<div class="btn-row"><button class="valid-btn" data-day="'+st.day+'" data-node="'+esc(st.to.n)+'">\u2713 Fait comme prévu \u2014 '+esc(st.to.n)+'</button></div>'
      +'<div class="addrow" style="margin-top:8px">'
      +'<select class="done-sel" data-day="'+st.day+'">'
      + alts.map(function(a){
          var exact = (a.i===iTo && rk!==null);
          return '<option value="'+a.i+'"'+(a.i===iTo?' selected':'')+'>'+esc(a.n)+' \u00b7 '
            +(exact?'':'\u2248 ')+(exact?rk:a.km)+' km</option>'; }).join('')
      +'</select><button class="valid-other" data-day="'+st.day+'">Valider</button></div>'
      +'<div class="btn-row"><button class="pickmap-btn" data-day="'+st.day+'" data-stage="'+st.id+'">\ud83d\udccd Choisir un point sur la carte</button></div>'
      +'<p class="muted" style="font-size:.76rem;margin-top:6px">Arrêtés entre deux villages ? Touche ce bouton puis le point exact sur la carte.</p>';
  }
  h += '</div>';                       /* fin du bloc « où avez-vous dormi » */

  if(st.forced){ h += '<div class="warnbox" style="margin-top:10px">Étape imposée par le retard accumulé.</div>'; }
  h += '</div>';                       /* fin de la carte d'en-tête */

  h += '<div class="card"><h3>Carte</h3><div class="map" id="map-'+st.id+'" style="position:relative"></div>'
    +'<p class="map-note" id="rt-'+st.id+'">Chargement…</p>'
    +'<p class="map-note">Touche la carte pour la navigation plein écran.</p>'
    + surfBar(st.surfs, st.km)
    +'<div id="eau-'+st.id+'"></div>'
    +'</div>'
    +'<div class="btn-row"><button class="guidon-btn" data-stage="'+st.id+'">\ud83e\udded Navigation</button>'
    +'<button class="gpx-btn" data-stage="'+st.id+'">\u2b07\ufe0f GPX</button></div></div>';

  h += '<div class="card"><h3>Profil de dénivelé</h3><div class="profile" id="prof-'+st.id+'"></div>'
    +'<p class="map-note" id="profnote-'+st.id+'">Calculé sur le tracé réel dès le chargement de la carte.</p></div>';

  h += '<div class="card"><h3>Sur la route</h3><ul class="tl">';
  st.pts.forEach(function(p,i){
    var role = i===0 ? 'Départ' : (i===st.pts.length-1 ? 'Arrivée' : 'Passage');
    var sf = SURF[p.surf]||SURF.vv;
    h += '<li><span class="h">'+role+'</span><span class="t"><b>'+esc(p.n)+'</b>'
      +(i>0?' <span class="vv">'+sf.ico+' '+esc(p.vr||'')+'</span>':'')
      +'<div class="svc">'+(p.svc||[]).map(function(x){ return '<span class="on">'+esc(x)+'</span>'; }).join('')+'</div>'
      +'</span></li>';
  });
  h += '</ul></div>';

  /* ---- refuge canicule + options de camping ---- */
  h += '<div class="card"><h3>\ud83c\udfd5 '+esc(st.to.n)+'</h3>';
  (st.to.camps||[]).forEach(function(c){
    h += '<div class="camp"><b>'+c.n+'</b><span class="ct">'+c.t+'</span></div>';
  });
  h += '<p class="muted" style="margin-top:8px;font-size:.8rem">'+esc(st.to.gare)+'</p>';
  h += '</div>';
  return h;
}

function gearItems(ci){
  var out = [];
  GEAR[ci][1].forEach(function(t, ii){
    if(GEARDEL[ci+'-'+ii]) return;
    out.push({key:ci+'-'+ii, text:t, custom:false});
  });
  (GEARADD[ci]||[]).forEach(function(o){
    out.push({key:'c'+o.id, text:o.t, custom:true});
  });
  return out;
}
function gearCounts(){
  var d=0, t=0;
  GEAR.forEach(function(_, ci){
    gearItems(ci).forEach(function(it){
      t++;

    });
  });
  return {done:d, total:t};
}

/* Bandeau posé SUR la carte : le retour doit être visible là où l'on touche. */

}
/* Enregistre un arrêt libre : le point est projeté sur le parcours, inséré
   dans la chaîne comme un village, et la journée est validée dessus. */
/* Mesure BRouter d'un tronçon quelconque, mise en cache.
   Un arrêt libre coupe un segment en deux : plutôt que d'estimer le détour
   (ce qui donnait 73 km estimés contre 87 km réels), on mesure vraiment les
   deux moitiés. Les distances sont alors exactes, même très loin du tracé. */
function legKey(a, b){
  return 'bourgleg-'+a[0].toFixed(4)+'_'+a[1].toFixed(4)+'_'+b[0].toFixed(4)+'_'+b[1].toFixed(4);
}
function routeKmBetween(a, b, cb){
  var k = legKey(a,b);
  try{
    var c = localStorage.getItem(k);
    if(c!==null){ cb(+c); return; }
  }catch(e){}
  var url = 'https://brouter.de/brouter?lonlats='
    + a[1].toFixed(5)+','+a[0].toFixed(5)+'|'+b[1].toFixed(5)+','+b[0].toFixed(5)
    + '&profile=trekking&alternativeidx=0&format=geojson';
  fetch(url).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
  .then(function(gj){
    var co = gj.features[0].geometry.coordinates.map(function(q){ return [q[1],q[0]]; });
    var km = Math.round(coKm(co));
    if(km>0){ try{ localStorage.setItem(k, String(km)); }catch(e){} cb(km); }
    else cb(null);
  }).catch(function(){ cb(null); });
}
/* Mesure les deux moitiés autour d'un arrêt et relance le calcul des étapes. */
function measureStop(dayKey){
  var sp = STATE.stops[dayKey];
  if(!sp || !sp.after) return;
  var chain = RUN.chain;
  var i = -1;
  chain.forEach(function(n,x){ if(n.key===sp.after) i = x; });
  if(i<0) return;
  var stopNode = null, nextNode = null;
  chain.forEach(function(n,x){ if(n.key==='s'+dayKey){ stopNode = n; nextNode = chain[x+1]; } });
  if(!stopNode) return;
  var todo = 2, note = null;
  function done(){
    if(--todo > 0) return;
    saveState();
    RUN = computeStages();
    render();
  }
  routeKmBetween(chain[i].ll, [sp.lat, sp.lng], function(km){
    if(km!=null){ sp.a = km; } done();
  });
  if(nextNode){
    routeKmBetween([sp.lat, sp.lng], nextNode.ll, function(km){
      if(km!=null){ sp.b = km; } done();
    });
  } else { done(); }
}

/* Premier temps : on montre le point touché, la distance calculée, et on
   demande confirmation. Le retour est immédiat et visible sur la carte. */
function proposeStop(st, latlng){
  var el = document.getElementById('map-'+st.id);
  var m = maps[st.id];
  if(!el || !m) return;
  var i0 = st.chain.indexOf(st.from);

  /* Projection sur la CHAÎNE (villages) : donne le segment d'insertion. */
  var bi = 0, bd = Infinity, bt = 0;
  for(var j=0;j<st.chain.length-1;j++){
    var rr = segCalc([latlng.lat, latlng.lng], st.chain[j].ll, st.chain[j+1].ll);
    if(rr.d < bd){ bd = rr.d; bi = j; bt = rr.t; }
  }
  var kmTo = st.cum[bi] + (st.cum[bi+1]-st.cum[bi])*bt - st.cum[i0];

  /* Écart réel : mesuré sur le TRACÉ ROUTÉ quand il est chargé. La chaîne
     n'est qu'une ligne droite de village en village ; un point pile sur le
     halage pouvait s'en écarter de plusieurs kilomètres et être refusé. */
  var co = ROUTED[st.id];
  var off = bd, tol = 8000;
  if(co && co.length > 1){
    var line = co.map(function(c){ return [c[0],c[1]]; });
    off = distToLine([latlng.lat, latlng.lng], line);
    tol = 2500;
    /* distance parcourue mesurée sur le tracé réel, bien plus juste */
    var pr = projectOn(line, [latlng.lat, latlng.lng]);
    if(pr && pr.i >= 0){
      var cum2 = cumDist(line);
      var frac = segFrac([latlng.lat, latlng.lng], line[pr.i], line[Math.min(pr.i+1, line.length-1)]);
      var along = cum2[pr.i] + (pr.i < line.length-1 ? (cum2[pr.i+1]-cum2[pr.i])*frac : 0);
      if(along > 0){ kmTo = along/1000; }
    }
  }

  if(el._pickMk){ try{ m.removeLayer(el._pickMk); }catch(e){} }
  el._pickMk = L.marker(latlng, {icon: dotIcon('\ud83d\udccd','#e07b39')}).addTo(m);
  PICK.pending = {lat:latlng.lat, lng:latlng.lng, km:kmTo, off:off,
                  after: st.chain[bi] ? st.chain[bi].key : null,
                  afterN: st.chain[bi] ? st.chain[bi].n : null, t: bt};

  /* Un arrêt n'est pas toujours sur le canal : camping à 6 km, hébergement
     dans un village voisin, détour imprévu. On accepte donc l'écart et on le
     COMPTE dans la distance du jour, au lieu de refuser le point. */
  var offKm = off/1000;
  /* Plus de refus lié à l'écart : les distances sont mesurées par routage,
     donc justes même loin du tracé. Seule une valeur absurde est écartée. */
  if(offKm > 80){
    pickBanner(st.id, '', 'bad', '<span>Ce point est à '+Math.round(offKm)+' km du parcours \u2014 vérifie que c\u2019est bien l\u2019endroit voulu.</span>');
    return;
  }
  var totKm = kmTo + offKm;
  if(totKm <= 2){
    pickBanner(st.id, '', 'bad', '<span>Ce point est au départ de la journée. Touche plus loin sur le parcours.</span>');
    return;
  }
  if(totKm > 100){
    pickBanner(st.id, '', 'bad', '<span>'+Math.round(totKm)+' km depuis '+esc(st.from.n)+' \u2014 maximum 100 km.</span>');
    return;
  }
  PICK.pending.km = totKm;
  PICK.pending.off = off;
  pickBanner(st.id, '', (offKm > 12 ? 'warn' : 'ok'),
    '<span><b>\u2248 '+Math.round(totKm)+' km</b> depuis '+esc(st.from.n)
      + (offKm >= 1 ? '<br><i style="font-style:normal;opacity:.8">dont '+Math.round(offKm)+' km à l\u2019écart du tracé</i>' : '')
      +'</span>'
    +'<button class="pk-ok" data-day="'+st.day+'">Confirmer</button>');
}
function setStop(day, latlng){
  var key = 'd'+day;
  /* Refus explicite si le point choisi est hors de portée pour cette journée :
     sans message, le choix était silencieusement ignoré. */
  var stg = null;
  RUN.stages.forEach(function(x){ if(x.type==='ride' && x.day===day) stg = x; });
  if(stg){
    var i0 = stg.chain.indexOf(stg.from);
    var bi = 0, bd = Infinity, bt = 0;
    for(var j=0;j<stg.chain.length-1;j++){
      var rr = segCalc([latlng.lat, latlng.lng], stg.chain[j].ll, stg.chain[j+1].ll);
      if(rr.d < bd){ bd = rr.d; bi = j; bt = rr.t; }
    }
    var kmTo = stg.cum[bi] + (stg.cum[bi+1]-stg.cum[bi])*bt - stg.cum[i0];

  }
  STATE.stops[key] = {lat:+latlng.lat.toFixed(5), lng:+latlng.lng.toFixed(5),
                      off: (PICK.pending && PICK.pending.off) ? Math.round(PICK.pending.off) : 0,
                      after: (PICK.pending && PICK.pending.after) || null,
                      afterN: (PICK.pending && PICK.pending.afterN) || null,
                      t: (PICK.pending && PICK.pending.t!=null) ? +PICK.pending.t.toFixed(3) : 0.5};
  STATE.done[key] = 's'+key;
  Object.keys(STATE.done).forEach(function(k){
    var d2 = parseInt(k.slice(1),10);
    if(d2 === day) return;
    if(d2 > day && STATE.done[k]==='s'+k){ return; }
  });
  delete STATE.days[key];
  saveState();
  RUN = computeStages();
  /* validations devenues contradictoires */
  var pos = -1;
  RUN.chain.forEach(function(n,i){ if(n.key===STATE.done[key]) pos = i; });
  if(pos>-1){
    Object.keys(STATE.done).forEach(function(k){
      var d2 = parseInt(k.slice(1),10);
      if(d2===day) return;
      var p2 = -1;
      RUN.chain.forEach(function(n,i){ if(n.key===STATE.done[k] || i===STATE.done[k]) p2 = i; });
      if(p2<0) return;
      if((d2 < day && p2 >= pos) || (d2 > day && p2 <= pos)){
        delete STATE.done[k];
        if(STATE.stops[k]) delete STATE.stops[k];
      }
    });
    saveState();
    RUN = computeStages();
  }
  disarmPick();
  openStage = null; currentTab = 'etapes';
  render(); window.scrollTo(0,0);
  /* mesure des deux moitiés : les distances deviennent exactes */
  measureStop(key);
}
function validateDay(day, nodeIdx){
  if(nodeIdx===null || nodeIdx===undefined || nodeIdx==='') return;
  var dn = parseInt(day, 10);
  var idx = parseInt(nodeIdx, 10);
  var node = RUN.chain[idx];
  if(!node) return;
  /* on enregistre la CLÉ, pas la position : elle survit à l'insertion
     d'arrêts libres qui décalent tous les index suivants */
  STATE.done['d'+dn] = node.key;
  if(!node.custom && STATE.stops['d'+dn]){ delete STATE.stops['d'+dn]; }
  /* Une correction peut rendre d'autres validations impossibles : on ne peut
     pas être plus loin un jour antérieur, ni moins loin un jour postérieur.
     On retire donc celles qui deviennent contradictoires plutôt que de
     laisser un déroulé incohérent. */
  Object.keys(STATE.done).forEach(function(k){
    var d2 = parseInt(k.slice(1), 10);
    var v2 = STATE.done[k];
    if(d2 === dn) return;
    var p2 = -1;
    for(var z=0; z<RUN.chain.length; z++){
      if(RUN.chain[z].key===v2 || z===v2){ p2 = z; break; }
    }
    if(p2 < 0) return;
    if((d2 < dn && p2 >= idx) || (d2 > dn && p2 <= idx)){
      delete STATE.done[k];
      if(STATE.stops[k]) delete STATE.stops[k];
    }
  });
  delete STATE.days['d'+day];          /* le fait remplace le choix théorique */
  saveState();
  RUN = computeStages();
  openStage = null;
  currentTab = 'etapes';
  render();
  window.scrollTo(0,0);
}
function addGearItem(cat){
  var inp = document.querySelector('.gear-in[data-cat="'+cat+'"]');
  if(!inp) return;
  var v = (inp.value||'').trim();
  if(!v) { inp.focus(); return; }
  v = v.replace(/[<>]/g,'').slice(0,160);
  if(!GEARADD[cat]) GEARADD[cat] = [];
  GEARADD[cat].push({id: Date.now().toString(36)+Math.floor(Math.random()*1000), t: v});
  saveGear();
  inp.value = '';
  renderGear();
  var again = document.querySelector('.gear-in[data-cat="'+cat+'"]');
  if(again) again.focus();
}
mainEl.addEventListener('keydown', function(ev){
  if(ev.key==='Enter' && ev.target && ev.target.classList && ev.target.classList.contains('gear-in')){
    ev.preventDefault();
    addGearItem(ev.target.getAttribute('data-cat'));
  }
});

/* Balayage vers la droite = retour.
   Il ne doit PAS se déclencher quand le geste part de la carte : déplacer la
   carte vers la droite renvoyait à l'écran précédent. Les listes déroulantes
   et les champs de saisie sont écartés pour la même raison. */
(function(){
  var x0=null, y0=null, ok=false;
  function ignorable(el){
    if(!el || !el.closest) return false;
    return !!el.closest('.leaflet-container, select, input, textarea, .seg, .dgrid, .pickbar');
  }
  document.addEventListener('touchstart', function(e){
    if(e.touches.length!==1){ x0=null; ok=false; return; }
    ok = !ignorable(e.target);
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(x0===null || !ok || GUIDON.active || PICK.on){ x0=null; return; }
    var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
    /* geste franchement horizontal, pour éviter les retours involontaires */
    if(dx>90 && dy<50 && dx > dy*2.5){
      if(openStage){ openStage=null; render(); window.scrollTo(0,0); }
      else if(currentTab!=='sejour'){ showTab('sejour'); }
    }
    x0=null; ok=false;
  }, {passive:true});
})();

render();

/* thème clair / sombre */
(function(){
  var btn = document.getElementById('theme-toggle');
  function apply(th){
    if(th==='light'){ document.documentElement.setAttribute('data-theme','light'); }
    else{ document.documentElement.removeAttribute('data-theme'); }
    if(btn){ btn.textContent = th==='light' ? '\ud83c\udf19' : '\u2600\ufe0f'; }
    var mt = document.getElementById('meta-theme');
    if(mt){ mt.setAttribute('content', th==='light' ? '#f5f1e8' : '#08252e'); }
  }
  var cur = 'dark';
  try{ cur = localStorage.getItem('bourg-theme')||'dark'; }catch(e){}
  apply(cur);
  if(btn){
    btn.addEventListener('click', function(){
      cur = (cur==='light') ? 'dark' : 'light';
      try{ localStorage.setItem('bourg-theme', cur); }catch(e){}
      apply(cur);
    });
  }
})();

/* bandeau d'installation */
(function(){
  var deferred = null;
  function bar(html, label, onClick){
    if(document.querySelector('.install-bar')) return;
    var d = document.createElement('div');
    d.className = 'install-bar';
    d.innerHTML = '<span>'+html+'</span>'
      +(label ? '<button class="ib-go">'+label+'</button>' : '')
      +'<button class="ib-x" aria-label="Fermer">\u2715</button>';
    document.body.appendChild(d);
    var x = d.querySelector('.ib-x');
    x.addEventListener('click', function(){
      d.remove();
      try{ localStorage.setItem('bourg-install-hide','1'); }catch(e){}
    });
    var go = d.querySelector('.ib-go');
    if(go && onClick){ go.addEventListener('click', function(){ onClick(d); }); }
  }
  var hidden = false;
  try{ hidden = localStorage.getItem('bourg-install-hide')==='1'; }catch(e){}
  var standalone = false;
  try{ standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone; }catch(e){}
  if(hidden || standalone) return;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    bar('Installer l\u2019app sur l\u2019écran d\u2019accueil \u2014 elle fonctionne hors-ligne.', 'Installer', function(d){
      d.remove();
      deferred.prompt();
    });
  });
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if(iOS){
    setTimeout(function(){
      bar('Pour installer : bouton <b>Partager</b> puis <b>Sur l\u2019écran d\u2019accueil</b>.', '', null);
    }, 2500);
  }
})();

/* service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
