/* =========================================================
   MOTEUR DE CASCADE — séquentiel, jour après jour
   Chaque journée : plus court (-1) · normal (0) · plus long (+1)
   Le choix décale la nuitée, et TOUT ce qui suit est recalculé
   sur la distance et les jours restants.
   ========================================================= */
function buildChain(){
  var base = [];
  for(var i=0;i<CHAIN.length;i++){
    var n = CHAIN[i];
    /* Le bouclage compte DEUX villages : n'en retirer qu'un laissait le
       parcours se terminer à Longecourt-en-Plaine au lieu de Dijon. */
    if(n.loop && i>0 && !STATE.opts.bouclage) continue;
    /* clé stable : les index bougent dès qu'un arrêt libre est inséré, alors
       que les validations doivent survivre à ces insertions. */
    base.push(Object.assign({}, n, {key:'n'+i}));
  }
  /* Arrêts libres choisis sur la carte : insérés comme des villages, à leur
     position réelle le long du parcours. */
  var stops = [];
  Object.keys(STATE.stops||{}).forEach(function(k){
    var sp = STATE.stops[k];
    if(!sp || sp.lat==null) return;
    /* Un arrêt libre n'a de sens que comme ARRIVÉE de sa journée. Orphelin, il
       resterait un point de passage obligé au milieu d'une étape et créerait
       un aller-retour. On l'ignore, où qu'il vienne. */
    if(STATE.done[k] !== 's'+k){ return; }
    stops.push({k:k, lat:sp.lat, lng:sp.lng, name:sp.name, off:sp.off||0,
                after:sp.after||null, afterN:sp.afterN||null, t:sp.t, a:sp.a, b:sp.b});
  });
  if(!stops.length){ return base; }

  stops.forEach(function(sp){
    /* Ancrage mémorisé au moment du choix : le segment est celui de la
       JOURNÉE concernée. Reprojeter le point sur toute la boucle à chaque
       calcul le faisait atterrir n'importe où — un arrêt près de Génelard
       se retrouvait inséré entre Bourbon-Lancy et Decize. */
    /* L'ancre est vérifiée sur le terrain avant d'être utilisée : les clés
       sont des numéros d'ordre, et toute insertion ou permutation dans la
       liste des villages les décale. Un arrêt pouvait ainsi se retrouver
       rattaché à un segment situé 20 km plus loin. */
    if(sp.after){
      for(var a=0;a<base.length-1;a++){
        if(base[a].key === sp.after || base[a].n === sp.afterN){
          var ctrl = segCalc([sp.lat, sp.lng], base[a].ll, base[a+1].ll);
          if(ctrl.d <= 6000){                       /* ancre plausible : on la garde */
            sp._i = a; sp._t = (sp.t!=null ? sp.t : ctrl.t); return;
          }
          sp._reproj = true;
          break;                                    /* incohérente : on reprojette */
        }
      }
    }
    var bi = 0, bd = Infinity, bt = 0;
    for(var j=0;j<base.length-1;j++){
      var r = segCalc([sp.lat, sp.lng], base[j].ll, base[j+1].ll);
      if(r.d < bd){ bd = r.d; bi = j; bt = r.t; }
    }
    sp._i = bi; sp._t = bt;
  });
  /* insertion de la fin vers le début pour ne pas décaler les positions */
  stops.sort(function(a,b){ return (b._i - a._i) || (b._t - a._t); });
  stops.forEach(function(sp){
    var nxt = base[sp._i+1];
    if(!nxt) return;
    var total = nxt.km;
    var part = Math.max(1, Math.round(total * sp._t));
    if(part >= total) part = Math.max(1, total-1);
    var rest = Math.max(1, total - part);
    /* Si les deux moitiés ont été mesurées par routage, on les prend telles
       quelles : c'est exact, même pour un point très éloigné du tracé. Sinon
       on retombe sur l'estimation géométrique plus l'écart au tracé. */
    /* mesures liées à l'ancre : inutilisables si celle-ci a été reprojetée */
    if(sp._reproj){ sp.a = null; sp.b = null; }
    if(sp.a != null && sp.b != null){
      part = Math.max(1, sp.a); rest = Math.max(1, sp.b);
    }else{
      var det = Math.round((sp.off||0)/1000);
      part += det; rest += det;
    }
    var node = {
      n: sp.name || ('Arrêt libre \u00b7 ' + base[sp._i].n + ' \u2192 ' + nxt.n),
      ll: [sp.lat, sp.lng], km: part, surf: nxt.surf, vr: nxt.vr,
      gare: '\u2014', svc: [], camps: [{n:'Point choisi sur la carte', t:'arrêt libre'}],
      key: 's'+sp.k, custom: true
    };
    base.splice(sp._i+1, 0, node);
    base[sp._i+2].km = rest;
  });
  return base;
}

function chainCum(chain){
  var cum=[0];
  for(var i=1;i<chain.length;i++){ cum.push(cum[i-1]+chain[i].km); }
  return cum;
}
function computeStages(){
  var chain = buildChain();
  var cum = chainCum(chain);
  var M = chain.length, T = cum[M-1];
  var rideDays = TOTAL_DAYS;

  function bounds(cap, minSeg){
    var mn = new Array(M).fill(Infinity), mx = new Array(M).fill(-Infinity);
    mn[M-1] = 0; mx[M-1] = 0;
    for(var q=M-2; q>=0; q--){
      for(var k2=q+1; k2<M; k2++){
        var sg = cum[k2]-cum[q];
        if(sg > cap) break;
        if(mn[k2]!==Infinity){ mn[q] = Math.min(mn[q], 1+mn[k2]); }
        if(mx[k2]!==-Infinity && (sg >= minSeg || k2===M-1)){ mx[q] = Math.max(mx[q], 1+mx[k2]); }
      }
    }
    return {mn:mn, mx:mx};
  }

  /* index du maillon confirmé pour un jour donné, ou -1 */
  function doneIdx(day, after){
    var v = STATE.done['d'+day];
    if(typeof v === 'string' && v.length && !/^\d+$/.test(v)){
      for(var ki=0; ki<M; ki++){ if(chain[ki].key===v) return ki; }
      return -1;
    }
    if(v===undefined || v===null) return -1;
    if(typeof v === 'number'){ return (v>=0 && v<M) ? v : -1; }
    /* ancien format (nom) : on cherche la première occurrence APRÈS la position
       courante — indispensable car Saint-Jean-de-Losne apparaît deux fois. */
    for(var i=(after||0)+1; i<M; i++){ if(chain[i].n===v) return i; }
    for(var j=0;j<M;j++){ if(chain[j].n===v) return j; }
    return -1;
  }

  /* Passe 1 : où sommes-nous réellement après la dernière journée validée ?
     La réalité prime sur le plan — on adapte le plafond au reste à parcourir. */
  var lastDone = 0, lastDoneDay = 0;
  for(var dd=1; dd<=rideDays; dd++){
    var di = doneIdx(dd, lastDone);
    if(di > lastDone && (cum[di]-cum[lastDone]) <= 115){ lastDone = di; lastDoneDay = dd; }
  }
  var remainKm = T - cum[lastDone], remainDays = rideDays - lastDoneDay;
  var needAvg = remainDays > 0 ? remainKm/remainDays : 0;
  var CAP = Math.max(PLAN.cap, Math.ceil(needAvg*1.3/2)*2);
  var MINSEG = 12, capRaised = Math.max(0, CAP - PLAN.cap);
  var B = bounds(CAP, MINSEG), guard = 0;
  while(B.mn[0] > rideDays && CAP < 110 && guard++ < 25){ CAP += 4; capRaised += 4; B = bounds(CAP, MINSEG); }
  guard = 0;
  while(B.mx[0] < rideDays && MINSEG > 0 && guard++ < 20){ MINSEG = Math.max(0, MINSEG-3); B = bounds(CAP, MINSEG); }
  var minD = B.mn, maxD = B.mx;
  var LIMIT = Math.max(needAvg + 6, CAP - 10);

  /* Passe 2 : le déroulé, jour après jour */
  var stages = [], at = 0, behind = false;
  for(var day=1; day<=rideDays; day++){
    var left = rideDays - day + 1;
    var to, forced = false, confirmed = false;
    var opts = {court:null, normal:null, long:null};

    var fixed = doneIdx(day, at);
    /* garde-fou : une journée validée à plus de 120 km est une donnée aberrante
       (stockage corrompu, ancien format mal résolu) — on l'ignore. */
    if(fixed > at && (cum[fixed]-cum[at]) > 115){ fixed = -1; delete STATE.done['d'+day]; }
    if(fixed > at || (fixed === at && day <= lastDoneDay)){
      /* journée validée : le point d'arrivée est un fait, pas un calcul */
      to = Math.max(fixed, at);
      if(to === at && to < M-1){ to = at; }
      confirmed = true;
      opts = {court:null, normal:to, long:null};
    }else if(day === rideDays){
      to = M-1;
      opts = {court:null, normal:M-1, long:null};
    }else{
      var remain = T - cum[at];
      var target = remain / left;
      var choice = (STATE.days['d'+day]===-1 || STATE.days['d'+day]===1) ? STATE.days['d'+day] : 0;

      /* On n'exige plus de remplir TOUS les jours restants : la condition
         « restDays <= maxD[j] » supprimait les alternatives dès qu'on prenait
         de l'avance, puisqu'il devenait impossible d'étirer le reste du
         parcours sur autant de journées. Seule contrainte conservée : depuis
         le point choisi, l'arrivée doit rester atteignable dans le temps qui
         reste. Boucler plus tôt est donc permis — les jours en trop
         deviennent des journées libres. */
      /* Une journée validée plus loin dans le séjour doit être atteinte CE
         jour-là : les journées précédentes ne doivent donc pas la dépasser,
         ni s'y arrêter. Sans cette borne, un arrêt fixé au J4 pouvait être
         « consommé » dès le J3, qui l'atteignait naturellement le premier. */
      var nfIdx = null, nfDay = null;
      for(var q2=day+1; q2<=rideDays; q2++){
        var fq = doneIdx(q2, at);
        if(fq > at){ nfIdx = fq; nfDay = q2; break; }
      }
      var jMax = M-1;
      if(nfIdx != null){ jMax = Math.min(jMax, nfIdx - (nfDay - day)); }

      /* Le plafond quotidien sert à composer l'étape « normale ». Pour la
         LISTE des choix on va un peu au-delà, sinon l'option « plus long »
         disparaissait dès que l'étape normale approchait du plafond. */
      var CAPOPT = Math.max(CAP, 78);
      var hard = [], soft = [];
      for(var j=at+1; j<=jMax; j++){
        var seg = cum[j]-cum[at];
        if(seg > CAPOPT) break;
        /* La longueur minimale d'étape cède devant un arrêt fixé par
           l'utilisateur : son choix de jour prime sur notre règle de confort,
           sinon l'arrêt était purement et simplement ignoré. */
        if(seg < MINSEG && left>1 && j<M-1 && nfIdx==null) continue;
        var restDays = left-1;
        if(restDays > 0 && minD[j] > restDays) continue;
        hard.push(j);
        if(restDays === 0 || (T-cum[j])/restDays <= LIMIT || j===M-1){ soft.push(j); }
      }
      var cands = soft.length ? soft : hard;
      if(!cands.length){
        forced = true; behind = true;
        var far = -1;
        for(var j2=at+1; j2<M; j2++){
          if(cum[j2]-cum[at] > CAP) break;
          if(minD[j2] <= left-1) far = j2;
        }
        if(far < 0){ for(var j3=at+1; j3<M; j3++){ if(cum[j3]-cum[at] <= CAP) far = j3; } }
        cands = [far>0 ? far : Math.min(at+1, M-1)];
      }else if(!soft.length){
        forced = true;
        cands = [hard[hard.length-1]];
      }
      /* l'étape « normale » reste sous le plafond quotidien tant qu'un
         candidat le permet ; les dépassements ne servent qu'aux options */
      var sousCap = cands.filter(function(z){ return cum[z]-cum[at] <= CAP; });
      var pool = sousCap.length ? sousCap : cands;
      var best = pool[0], bd = Infinity;
      pool.forEach(function(k){
        var dv = Math.abs((cum[k]-cum[at]) - target);
        if(dv < bd){ bd = dv; best = k; }
      });
      var pos = cands.indexOf(best);
      var pick = forced ? pos : Math.min(cands.length-1, Math.max(0, pos + choice));
      to = cands[pick];

      /* Les alternatives sont prises directement sur les villages VOISINS de
         l'étape retenue, et non dans la liste filtrée : celle-ci écartait des
         villages parfaitement praticables (Corbigny à 62 km alors que le
         plafond du jour était à 60), d'où des « à choisir » inutiles.
         On garde deux garde-fous : l'arrivée doit rester atteignable, et
         l'étape doit rester dans des bornes humaines. */
      var restD = left-1;
      var LONGMAX = Math.max(CAP, 78);
      function voisin(from0, dir){
        for(var j2 = from0 + dir; j2 > at && j2 <= M-1; j2 += dir){
          var sg = cum[j2]-cum[at];
          if(sg < 10) return null;                       /* trop court pour une journée */
          if(dir > 0 && sg > LONGMAX) return null;
          if(restD > 0 && minD[j2] > restD) continue;    /* n'empêche pas la suite */
          return j2;
        }
        return null;
      }
      var iC = voisin(pick===pos ? to : cands[pos], -1);
      var iL = voisin(pick===pos ? to : cands[pos], 1);
      if(choice === -1 && iC != null){ to = iC; iC = voisin(iC, -1); iL = cands[pos]; }
      else if(choice === 1 && iL != null){ to = iL; iL = voisin(iL, 1); iC = cands[pos]; }
      opts = {court: (iC!=null && iC!==to) ? iC : null,
              normal: to,
              long: (iL!=null && iL!==to) ? iL : null};
    }
    if(to <= at && at < M-1){ to = Math.min(at+1, M-1); }

    var via = [];
    for(var v=at+1; v<to; v++){ via.push(chain[v]); }
    var surfs = {};
    for(var sf=at+1; sf<=to; sf++){ surfs[chain[sf].surf] = (surfs[chain[sf].surf]||0)+chain[sf].km; }
    stages.push({
      type:'ride', from:chain[at], to:chain[to], via:via,
      km: cum[to]-cum[at], pts:[chain[at]].concat(via,[chain[to]]),
      opts:opts, applied:(STATE.days['d'+day]===-1?-1:(STATE.days['d'+day]===1?1:0)),
      forced:forced, confirmed:confirmed, chain:chain, cum:cum, surfs:surfs,
      kmCourt: opts.court!=null ? cum[opts.court]-cum[at] : null,
      kmLong:  opts.long!=null  ? cum[opts.long]-cum[at]  : null
    });
    at = to;
    if(at >= M-1 && day < rideDays){
      /* arrivée atteinte avant la fin : les jours restants sont libres */
      for(var extra=day+1; extra<=rideDays; extra++){
        stages.push({type:'free', at:chain[M-1]});
      }
      break;
    }
  }

  /* Nombre minimal de journées encore nécessaires depuis le point atteint :
     permet de dire à quelle date la boucle pourrait se refermer au plus tôt. */
  var atNow = 0;
  stages.forEach(function(x){ if(x.type==='ride' && x.confirmed){ atNow = chain.indexOf(x.to); } });
  var minLeft = (atNow>=0 && minD[atNow]!==Infinity) ? minD[atNow] : null;

  var rideNo = 0;
  stages.forEach(function(st,i){
    var dt = new Date(DATE0.getTime());
    dt.setDate(dt.getDate()+i);
    st.day = i+1;
    st.date = dt;
    st.dstr = JOURS[dt.getDay()]+' '+dt.getDate()+' '+MOIS[dt.getMonth()];
    st.id = 'e'+(i+1);
    st.color = DAYCOLORS[i%DAYCOLORS.length];
    if(st.type==='ride'){ rideNo++; st.rideNo = rideNo; }
  });
  return {stages:stages, chain:chain, total:T, rideDays:rideDays, rest:0, restReduced:0,
          cap:CAP, capRaised:capRaised, behind:behind,
          lastDoneDay:lastDoneDay, doneKm:cum[lastDone], remainKm:remainKm, remainDays:remainDays, minLeft:minLeft,
          needAvg:needAvg};
}

/* =========================================================
   4. RENDU · CARTES · ROUTAGE · GPX · MODE GUIDON
   ========================================================= */
var RUN = computeStages();
var maps = {};
var ROUTED = {};
var REAL = {};
try{ REAL = JSON.parse(localStorage.getItem('bourgreal-'+GEN)||'{}'); }catch(e){ REAL = {}; }
function saveReal(){ try{ localStorage.setItem('bourgreal-'+GEN, JSON.stringify(REAL)); }catch(e){} }

var mainEl = document.getElementById('main');
var tabsEl = document.getElementById('tabs');
var currentTab = 'sejour';
var openStage = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function distM(a,b){
  var R=6371000, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  var la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
  var x=Math.sin(dLat/2), y=Math.sin(dLon/2);
  var h=x*x+Math.cos(la1)*Math.cos(la2)*y*y;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* Points de passage d'une étape : uniquement les villages du parcours.
   Un arrêt libre n'y figure que s'il est le départ ou l'arrivée du jour ;
   au milieu, il imposerait un détour hors tracé. */
/* Points de passage envoyés au routage.
   On reste collé au parcours prévu : tous les villages de l'étape sont
   imposés, dans l'ordre. Un arrêt libre n'est jamais traversé — il n'est
   ajouté qu'en fin, comme destination : le tracé suit donc la trace puis
   bifurque vers lui.
   Filtrer les villages « qui n'approchent pas de l'arrivée » a été essayé et
   supprimé : cela retirait Decize du J4, alors que l'itinéraire y passe
   vraiment. Les coudes du canal font partie du parcours. */
function stageWps(st){
  var villages = st.pts.filter(function(p){ return !p.custom; }).map(function(p){ return p.ll; });
  var fin = st.pts[st.pts.length-1];
  if(fin && fin.custom){ villages.push(fin.ll); }
  var dep = st.pts[0];
  if(dep && dep.custom){ villages.unshift(dep.ll); }
  if(villages.length < 2){ return [st.from.ll, st.to.ll]; }
  return villages;
}
function stageKey(st){
  return 'bourgrt-'+GEN+'-'+st.pts.map(function(p){return p.n;}).join('_').replace(/[^A-Za-z0-9_]/g,'').slice(0,90);
}
function realKm(st){ var r = REAL[stageKey(st)]; return (typeof r==='number') ? r : null; }
/* Longueur réelle d'un tracé routé, en km */
function coKm(co){
  var d = 0;
  for(var i=1;i<co.length;i++){ d += distM(co[i-1], co[i]); }
  return Math.round(d/1000);
}
/* Enregistre la distance réelle d'une étape (garde-fou : on ignore un routage
   aberrant, écart de plus de 40 % avec l'estimation). Renvoie true si retenue. */
function applyRealKm(st, co){
  if(!co || co.length<2) return false;
  var km = coKm(co);
  if(km<=0) return false;
  if(Math.abs(km - st.km)/Math.max(st.km,1) >= 0.40) return false;
  REAL[stageKey(st)] = km; saveReal();
  return true;
}
/* Rafraîchit les distances affichées sur l'accueil sans reconstruire la page
   (un re-rendu détruirait la carte et les marqueurs déjà chargés). */
function refreshKmDisplay(){
  var rides = RUN.stages.filter(function(s){ return s.type==='ride'; });
  var lis = document.querySelectorAll('#sec-sejour .chain li[data-stage]');
  lis.forEach(function(li){
    var id = li.getAttribute('data-stage');
    var st = null;
    rides.forEach(function(x){ if(x.id===id) st = x; });
    if(!st) return;
    var cell = li.querySelector('.st');
    if(!cell) return;
    var extra = cell.innerHTML.indexOf('<br>');
    var tail = extra>-1 ? cell.innerHTML.slice(extra) : '';
    cell.innerHTML = kmLabel(st) + tail;
  });
  var kms = rides.map(function(s){ var r=realKm(s); return r!==null?r:s.km; });
  var tot = Math.round(kms.reduce(function(a,b){return a+b;},0));
  var stats = document.querySelectorAll('#sec-sejour .stats .stat b');
  if(stats.length>=4){
    stats[0].textContent = tot+' km';
    stats[2].textContent = Math.round(tot/rides.length)+' km';
    stats[3].textContent = Math.round(Math.max.apply(null,kms))+' km';
  }
}
function kmLabel(st){
  if(st.type==='rest') return 'repos';
  var r = realKm(st);
  return r!==null ? (r+' km') : ('\u2248 '+Math.round(st.km)+' km');
}

/* ---------- routage BRouter ---------- */
function getRoute(st, cb){
  var key = stageKey(st);
  try{
    var c = localStorage.getItem(key);
    if(c){ cb(JSON.parse(c), 'cache'); return; }
  }catch(e){}
  /* Un seul tracé, fidèle au parcours : plus d'essai « au plus court » qui
     pouvait abandonner l'itinéraire officiel (Decize évité, par exemple). */
  var url = 'https://brouter.de/brouter?lonlats='
    + stageWps(st).map(function(p){ return p[1].toFixed(5)+','+p[0].toFixed(5); }).join('|')
    + '&profile=trekking&alternativeidx=0&format=geojson';
  function attempt(left){
    fetch(url).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(gj){
      var f = gj && gj.features && gj.features[0];
      if(!f) throw new Error('vide');
      var co = f.geometry.coordinates.map(function(q){
        return [ +q[1].toFixed(5), +q[0].toFixed(5), (q.length>2 && q[2]!=null) ? Math.round(q[2]) : null ];
      });
      if(co.length > 900){
        var step = Math.ceil(co.length/900), o=[];
        for(var i=0;i<co.length;i+=step){ o.push(co[i]); }
        if(o[o.length-1]!==co[co.length-1]) o.push(co[co.length-1]);
        co = o;
      }
      try{ localStorage.setItem(key, JSON.stringify(co)); }catch(e){}
      cb(co, 'live');
    }).catch(function(){
      if(left>0){ setTimeout(function(){ attempt(left-1); }, 1500); }
      else{ cb(null,'fail'); }
    });
  }
  attempt(2);
}
function buildProfile(co){
  if(!co || co.length<2 || co[0][2]==null) return null;
  var km=[0], el=[co[0][2]];
  for(var i=1;i<co.length;i++){
    km.push(km[i-1]+distM(co[i-1],co[i])/1000);
    el.push(co[i][2]==null?el[i-1]:co[i][2]);
  }
  var sm=[], W=3;
  for(var i2=0;i2<el.length;i2++){
    var a=0,c=0;
    for(var j=Math.max(0,i2-W);j<=Math.min(el.length-1,i2+W);j++){ a+=el[j]; c++; }
    sm.push(a/c);
  }
  var dp=0;
  for(var i3=1;i3<sm.length;i3++){ var d=sm[i3]-sm[i3-1]; if(d>0) dp+=d; }
  var prof=[], N=Math.min(120, sm.length);
  for(var i4=0;i4<N;i4++){
    var idx=Math.round(i4*(sm.length-1)/(N-1));
    prof.push([+km[idx].toFixed(1), Math.round(sm[idx])]);
  }
  return {prof:prof, dplus:Math.round(dp/10)*10, totalKm:Math.round(km[km.length-1])};
}
function profileSvg(prof){
  if(!prof || prof.length<2){ return '<p class="map-note">Profil disponible dès le chargement de la carte.</p>'; }
  var W=600,H=130,padL=34,padR=8,padT=10,padB=22;
  var maxKm=prof[prof.length-1][0]||1;
  var alts=prof.map(function(p){return p[1];});
  var minA=Math.min.apply(null,alts), maxA=Math.max.apply(null,alts);
  if(maxA-minA<40){ maxA=minA+40; }
  function X(k){ return padL+(k/maxKm)*(W-padL-padR); }
  function Y(a){ return padT+(1-(a-minA)/(maxA-minA))*(H-padT-padB); }
  var d='M'+X(prof[0][0]).toFixed(1)+','+Y(prof[0][1]).toFixed(1);
  for(var i=1;i<prof.length;i++){ d+='L'+X(prof[i][0]).toFixed(1)+','+Y(prof[i][1]).toFixed(1); }
  var area=d+'L'+X(maxKm)+','+(H-padB)+'L'+X(0)+','+(H-padB)+'Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Profil de dénivelé">'
    +'<path d="'+area+'" fill="rgba(240,184,96,.16)"></path>'
    +'<path d="'+d+'" fill="none" stroke="#f0b860" stroke-width="2"></path>'
    +'<text x="2" y="'+(Y(maxA)+4)+'" fill="#8fb3ad" font-size="11">'+Math.round(maxA)+'</text>'
    +'<text x="2" y="'+(Y(minA)+4)+'" fill="#8fb3ad" font-size="11">'+Math.round(minA)+'</text>'
    +'<text x="'+(W-40)+'" y="'+(H-6)+'" fill="#8fb3ad" font-size="11">'+Math.round(maxKm)+' km</text>'
    +'</svg>';
}

/* ---------- GPX ---------- */
function toGpx(name, co){
  var pts = co.map(function(c){
    return '      <trkpt lat="'+c[0]+'" lon="'+c[1]+'">'+(c[2]!=null?'<ele>'+c[2]+'</ele>':'')+'</trkpt>';
  }).join('\n');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Tour de Bourgogne" xmlns="http://www.topografix.com/GPX/1/1">\n'
    +'  <metadata><name>'+name+'</name></metadata>\n  <trk>\n    <name>'+name+'</name>\n    <trkseg>\n'
    +pts+'\n    </trkseg>\n  </trk>\n</gpx>\n';
}
function downloadGpx(sid){
  var st = RUN.stages.find(function(s){ return s.id===sid; });
  if(!st) return;
  var co = ROUTED[sid] || (st.pts||[]).map(function(p){ return [p.ll[0],p.ll[1],null]; });
  var nm = 'J'+st.day+' '+st.from.n+' - '+st.to.n;
  var blob = new Blob([toGpx(nm, co)], {type:'application/gpx+xml'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nm.replace(/[^A-Za-z0-9 -]/g,'').replace(/\s+/g,'-')+'.gpx';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadAllGpx(){
  var co = [];
  RUN.stages.forEach(function(st){
    if(st.type!=='ride') return;
    var c = ROUTED[st.id];
    if(c){ co = co.concat(c); }
    else{ st.pts.forEach(function(p){ co.push([p.ll[0],p.ll[1],null]); }); }
  });
  var blob = new Blob([toGpx('Tour de Bourgogne 2026 - parcours complet', co)], {type:'application/gpx+xml'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Tour-de-Bourgogne-2026-complet.gpx';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- cartes ---------- */
function startIcon(){
  return L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15],
    html:'<div style="width:30px;height:30px;border-radius:50%;background:#f0b860;border:3px solid #08252e;'
      +'display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.5)">\u2605</div>'});
}
function dotIcon(txt, col){
  return L.divIcon({className:'', iconSize:[24,24], iconAnchor:[12,12],
    html:'<div style="width:24px;height:24px;border-radius:50%;background:'+col+';border:2px solid #08252e;'
      +'display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.45)">'+txt+'</div>'});
}
function makeMap(elId){
  var m = L.map(elId, {scrollWheelZoom:false, zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:17, attribution:'&copy; OpenStreetMap · routage BRouter'}).addTo(m);
  return m;
}
function addLocate(m){
  /* Bouton « revenir à ma position ».
     Un appui recentre TOUJOURS sur la position courante et réactive le suivi,
     où que l'on se soit déplacé sur la carte. Un appui long (600 ms) coupe le
     GPS — auparavant un simple appui l'éteignait, ce qui rendait le bouton
     inutilisable comme raccourci de recentrage. */
  var btn = L.control({position:'topright'});
  btn.onAdd = function(){
    var a = L.DomUtil.create('a','loc-btn');
    a.href='#'; a.title='Revenir à ma position (appui long : couper le GPS)';
    a.innerHTML='\u25c9';
    m._locEl = a;
    paintLoc(m);
    var lp = null, longPressed = false;
    function start(){
      longPressed = false;
      lp = setTimeout(function(){
        longPressed = true;
        stopLocating(m);
      }, 600);
    }
    function cancel(){ if(lp){ clearTimeout(lp); lp=null; } }
    L.DomEvent.on(a,'mousedown', start);
    L.DomEvent.on(a,'touchstart', start);
    L.DomEvent.on(a,'mouseup', cancel);
    L.DomEvent.on(a,'mouseleave', cancel);
    L.DomEvent.on(a,'touchend', cancel);
    L.DomEvent.on(a,'touchcancel', cancel);
    L.DomEvent.on(a,'click',function(ev){
      L.DomEvent.stop(ev);
      cancel();
      if(longPressed){ longPressed=false; return; }
      recenter(m);
    });
    L.DomEvent.disableClickPropagation(a);
    return a;
  };
  btn.addTo(m);

  m.on('locationfound', function(e){
    m._lastFix = e.latlng;
    if(m._lm){ m.removeLayer(m._lm); }
    m._lm = L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:2,fillColor:'#4a9eff',fillOpacity:1}).addTo(m);
    if(m._acc){ m.removeLayer(m._acc); m._acc = null; }
    if(e.accuracy && e.accuracy > 25){
      m._acc = L.circle(e.latlng,{radius:e.accuracy, color:'#4a9eff', weight:1, opacity:.35, fillOpacity:.08}).addTo(m);
    }
    if(m._follow){
      /* Marquer le recentrage comme automatique : le zoom qu'il déclenche
         était pris pour un geste de l'utilisateur et coupait le suivi dès le
         premier point GPS — la carte ne suivait donc jamais. */
      m._selfMove = true;
      if(m._selfT) clearTimeout(m._selfT);
      m._selfT = setTimeout(function(){ m._selfMove = false; }, 900);
      /* sans animation : à 1 point GPS par seconde, les animations
         s'empilaient et la carte accusait un retard permanent sur la
         position réelle. */
      m.setView(e.latlng, Math.max(m.getZoom(),16), {animate:false});
    }
    paintLoc(m);
    if(GUIDON.active && maps[GUIDON.id]===m){
      navUpdate({lat:e.latlng.lat, lng:e.latlng.lng,
                 speed:(e.speed!=null?e.speed:null),
                 heading:(e.heading!=null?e.heading:null),
                 accuracy:(e.accuracy!=null?e.accuracy:null)});
    }
  });
  m.on('locationerror', function(){
    m._locError = true; paintLoc(m);
  });
  /* Se déplacer sur la carte suspend le suivi : le bouton devient alors
     l'invitation claire à revenir sur soi. */
  m.on('dragstart', function(){
    m._userMoved = true;
    if(m._follow){ m._follow = false; paintLoc(m); }
  });
  m.on('zoomstart', function(){
    /* seul un zoom NON provoqué par l'app suspend le suivi */
    if(m._follow && !m._selfMove){ m._userMoved = true; m._follow = false; paintLoc(m); }
  });

  /* Correction du glissement quand la carte est pivotée.
     Leaflet calcule le déplacement en pixels écran et l'applique tel quel au
     panneau, qui est ensuite tourné et agrandi par CSS : le doigt et la carte
     partaient donc dans des directions différentes. On convertit le décalage
     de l'espace écran vers l'espace interne de la carte, avant application. */
  var dr = m.dragging && m.dragging._draggable;
  if(dr && dr.on){
    dr.on('predrag', function(){
      if(!GUIDON.active || !GUIDON.headUp || GUIDON.id==null) return;
      if(maps[GUIDON.id] !== m) return;
      var th = -GUIDON.shown * Math.PI/180;
      var sc = 1;   /* l'élément est agrandi par sa taille, non par scale() */
      var off = dr._newPos.subtract(dr._startPos);
      var x = (off.x*Math.cos(th) - off.y*Math.sin(th)) * sc;
      var y = (off.x*Math.sin(th) + off.y*Math.cos(th)) * sc;
      dr._newPos = dr._startPos.add(L.point(x, y));
    });
  }
  m._locBtn = btn;
}
function paintLoc(m){
  var a = m._locEl;
  if(!a) return;
  var base = 'width:40px;height:40px;display:flex;align-items:center;justify-content:center;'
           + 'border-radius:10px;font-size:19px;text-decoration:none;border:1px solid ';
  if(!m._locating){
    a.style.cssText = base + '#1c4a5c;background:#10394a;color:#cfe6e2';
  }else if(m._follow){
    a.style.cssText = base + '#f0b860;background:#f0b860;color:#08252e';   /* suivi actif */
  }else{
    a.style.cssText = base + '#f0b860;background:#10394a;color:#f0b860';   /* GPS actif, suivi suspendu */
  }
}
function recenter(m){
  m._locError = false;
  if(!m._locating){
    m._locating = true;
    m._follow = true;
    paintLoc(m);
    m.locate({watch:true, enableHighAccuracy:true, maximumAge:5000});
    return;
  }
  m._follow = true;
  if(m._lastFix){
    m._selfMove = true;
    if(m._selfT) clearTimeout(m._selfT);
    m._selfT = setTimeout(function(){ m._selfMove = false; }, 900);
    m.setView(m._lastFix, Math.max(m.getZoom(),16), {animate:true});
  }
  paintLoc(m);
}
function stopLocating(m){
  if(!m._locating) return;
  try{ m.stopLocate(); }catch(e){}
  m._locating = false;
  m._follow = false;
  if(m._lm){ m.removeLayer(m._lm); m._lm = null; }
  if(m._acc){ m.removeLayer(m._acc); m._acc = null; }
  paintLoc(m);
}

function initStageMap(st){
  if(maps[st.id]){ setTimeout(function(){ maps[st.id].invalidateSize(); },60); return; }
  var el = document.getElementById('map-'+st.id);
  if(!el || typeof L==='undefined') return;
  var m = makeMap('map-'+st.id);
  maps[st.id] = m;
  addLocate(m);
  var raw = st.pts.map(function(p){ return p.ll; });
  var line = L.polyline(raw, {color:st.color, weight:3, opacity:.75, dashArray:'6 8'}).addTo(m);
  st.pts.forEach(function(p,i){
    var isEnd = (i===0 || i===st.pts.length-1);
    L.marker(p.ll, {icon: i===0 ? dotIcon('\u25b6','#f0b860') : (isEnd ? dotIcon('\ud83c\udfd5','#6fd6c9') : dotIcon(''+i,'#9fc48f'))})
     .addTo(m)
     .bindPopup('<b>'+esc(p.n)+'</b>'+(p.voir?'<br><span style="font-size:.8em">'+p.voir+'</span>':'')
       +(isEnd&&i>0&&p.camp?'<br><br>\ud83c\udfd5 '+esc(p.camp):''));
  });
  function fitStage(){
    if(!m._container || !m._container.parentNode || maps[st.id]!==m) return;
    try{
      m.invalidateSize();
      if(!m._userMoved){ m.fitBounds(line.getBounds(), {padding:[26,26]}); }
    }catch(e){}
  }
  fitStage();
  setTimeout(fitStage, 160);
  setTimeout(fitStage, 600);
  m.on('zoomstart dragstart', function(){ m._userMoved = true; });
  /* un appui sur la carte de l'étape ouvre la navigation plein écran */
  m.on('click', function(ev){
    if(PICK.on && PICK.sid===st.id){ proposeStop(st, ev.latlng); return; }
    /* On n'ignore l'appui que si le plein écran est RÉELLEMENT ouvert sur
       cette étape : se fier au seul drapeau laissait la navigation
       définitivement inaccessible en cas d'état résiduel. */
    var dejaOuvert = GUIDON.active && GUIDON.id===st.id
                     && document.querySelector('.guidon-fs') && document.querySelector('.navbar');
    if(!dejaOuvert){ enterGuidon(st.id); }
  });

  var note = document.getElementById('rt-'+st.id);
  if(note){ note.textContent = 'Tracé schématique — affinage par routage en cours…'; }
  getRoute(st, function(co, src){
    if(!co){
      if(note){ note.textContent = 'Routage indisponible — tracé schématique conservé. Recharge pour réessayer.'; }
      return;
    }
    ROUTED[st.id] = co;
    m.removeLayer(line);
    var ll = co.map(function(c){ return [c[0],c[1]]; });
    L.polyline(ll,{color:'#08252e',weight:6,opacity:.45}).addTo(m);
    L.polyline(ll,{color:st.color,weight:3,opacity:.95}).addTo(m);
    var pr = buildProfile(co);
    if(pr){
      var pe = document.getElementById('prof-'+st.id);
      if(pe){ pe.innerHTML = profileSvg(pr.prof); }
      var pn = document.getElementById('profnote-'+st.id);
      if(pn){ pn.textContent = 'Profil réel : '+pr.totalKm+' km · '+pr.dplus+' m de dénivelé positif (altitudes du routage).'; }
      if(pr.totalKm>0){
        var ok = applyRealKm(st, co);
        var ke = document.getElementById('km-'+st.id);
        if(ke){ ke.textContent = kmLabel(st); }
        /* le bouton sélectionné doit afficher la même valeur que l'encart */
        var selBtn = document.querySelector('.seg .dch.on b');
        if(selBtn && ok){
          var parts = selBtn.textContent.split('\u00b7');
          selBtn.textContent = kmLabel(st) + (parts.length>1 ? ' \u00b7'+parts.slice(1).join('\u00b7') : '');
        }
        var de = document.getElementById('dp-'+st.id);
        if(de){ de.textContent = pr.dplus+' m'; }
      }
    }
    if(note){ note.textContent = 'Tracé réel (routage vélo BRouter'+(src==='cache'?', en cache':'')+') — suit chemins de halage et petites routes.'; }
    loadStageWater(st, m);
  });
  if(ROUTED[st.id]) loadStageWater(st, m);
}

/* points d'eau de l'étape : marqueurs + liste triée par détour */
function loadStageWater(st, m){
  if(m._eauDone) return;
  m._eauDone = true;
  var box = document.getElementById('eau-'+st.id);
  if(box){ box.innerHTML = '<p class="mapstatus2" style="display:block">Recherche des points d\u2019eau à moins de 2 km\u2026</p>'; }
  getWater(st, function(list){
    if(!list){
      if(box){ box.innerHTML = '<p class="mapstatus2" style="display:block;color:var(--danger)">Points d\u2019eau indisponibles (serveur OpenStreetMap injoignable). Recharge la page pour réessayer \u2014 à faire en wifi avant le départ.</p>'; }
      return;
    }
    var g = L.layerGroup().addTo(m);
    list.forEach(function(wp){
      var stl = WSTYLE[wp[2]] || WSTYLE.tap;
      L.marker([wp[0],wp[1]],{icon:dotIcon(stl.ico, stl.col)}).addTo(g)
       .bindPopup('<b>'+(wp[4]||stl.lab)+'</b><br><span style="font-size:.85em">'+stl.lab+'<br>\u2248 '+wp[3]+' m du tracé</span>'
         +'<br><a href="https://www.google.com/maps?q='+wp[0]+','+wp[1]+'" target="_blank" rel="noopener">Ouvrir dans Maps</a>');
    });
    if(!box) return;
    if(!list.length){
      box.innerHTML = '<p class="mapstatus2" style="display:block">Aucun point d\u2019eau cartographié à moins de 2 km sur cette étape. Réflexe de secours : le <b>cimetière</b> de n\u2019importe quel village \u2014 robinet quasi systématique \u2014 ou demander à une écluse.</p>';
      return;
    }
    var taps = list.filter(function(w){ return w[2]!=='cim'; });
    var cims = list.filter(function(w){ return w[2]==='cim'; });
    var h = '<p class="mapstatus2" style="display:block">'+taps.length+' point'+(taps.length>1?'s':'')+' d\u2019eau potable et '+cims.length+' cimetière'+(cims.length>1?'s':'')+' à moins de 2 km \u00b7 coordonnées OpenStreetMap, gardées hors ligne.</p><div class="wlist">';
    list.slice(0,14).forEach(function(w){
      var stl = WSTYLE[w[2]] || WSTYLE.tap;
      h += '<div class="wrow"><span class="wi">'+stl.ico+'</span>'
        +'<span class="wt"><b>'+(w[4]||stl.lab)+'</b><i>'+stl.lab+'</i></span>'
        +'<a class="wd" href="https://www.google.com/maps?q='+w[0]+','+w[1]+'" target="_blank" rel="noopener">'+w[3]+' m</a></div>';
    });
    h += '</div>';
    box.innerHTML = h;
  });
}

function initOverviewMap(){
  if(maps.apercu){ setTimeout(function(){ maps.apercu.invalidateSize(); },60); return; }
  var el = document.getElementById('map-apercu');
  if(!el || typeof L==='undefined') return;
  var m = makeMap('map-apercu');
  maps.apercu = m;
  addLocate(m);

  /* --- couche 1 : le tracé et les étapes --- */
  var gTrace = L.layerGroup().addTo(m);
  var gCamps = L.layerGroup();
  var gBains = L.layerGroup();
  var gEau = L.layerGroup();
  var gVelo = L.layerGroup();
  m._g = {trace:gTrace, camps:gCamps, bains:gBains, eau:gEau, velo:gVelo};

  var all = [];
  var rides = RUN.stages.filter(function(s){ return s.type==='ride'; });
  var sketch = {};                      /* trait provisoire, effacé dès le routage */
  rides.forEach(function(st){
    var raw = st.pts.map(function(p){ return p.ll; });
    all = all.concat(raw);
    sketch[st.id] = L.polyline(raw,{color:st.color,weight:2,opacity:.5,dashArray:'5 7'}).addTo(gTrace)
     .bindTooltip('J'+st.day+' \u00b7 '+st.from.n+' \u2192 '+st.to.n+' \u00b7 '+kmLabel(st)+' (tracé en cours de calcul)');
  });
  L.marker(START,{icon:startIcon()}).addTo(gTrace)
   .bindPopup(START_POPUP + '<br><br><b>Départ J1 et arrivée J'+RUN.rideDays+'</b> \u2014 la boucle se referme ici.')
   .bindTooltip('D\u00e9part &amp; arriv\u00e9e');

  /* --- couche 3 : TOUS les campings du parcours --- */
  var nCamps = 0;
  RUN.chain.forEach(function(n){
    if(!n.camps || !n.camps.length) return;
    nCamps += n.camps.length;
    var html = '<b>'+esc(n.n)+'</b>';
    n.camps.forEach(function(c){
      html += '<br><br>\ud83c\udfd5 <b>'+c.n+'</b><br><span style="font-size:.85em">'+c.t+'<br>\u2600\ufe0f '+c.c+'</span>';
    });
    L.marker(n.ll,{icon:dotIcon('\ud83c\udfd5','#9fc48f')}).addTo(gCamps).bindPopup(html);
  });

  /* --- couche 4 : les points d'eau où se baigner --- */
  var nBains = 0;
  RUN.chain.forEach(function(n){
    var b = BAIN[n.n];
    if(!b) return;
    nBains++;
    var st2 = BAINSTYLE[b.t];
    L.marker([n.ll[0]+0.004, n.ll[1]+0.004],{icon:dotIcon(st2.ico, st2.col)})
     .addTo(gBains)
     .bindPopup('<b>'+esc(n.n)+'</b><br><span style="font-size:.85em">'+st2.lab+'</span><br>'+b.d);
  });

  /* --- couches réseau : chargement PAR JOURNÉE, à la demande ---------------
     Une requête pour tout le parcours sature Overpass. Ici, chaque journée est
     une requête minuscule (une bbox d'étape), déclenchée par un appui sur le
     numéro du jour, et conservée séparément. On charge à son rythme, et une
     journée déjà chargée n'est jamais redemandée. */
  m._dayState = {};                       /* 'ok' | 'load' | 'fail' par jour */
  m._dayG = {};                           /* un groupe de marqueurs PAR journée */
  m._shown = {};                          /* journées actuellement affichées */
  try{ m._shown = JSON.parse(localStorage.getItem('bourg-shown')||'{}') || {}; }catch(e){ m._shown = {}; }
  function saveShown(){ try{ localStorage.setItem('bourg-shown', JSON.stringify(m._shown)); }catch(e){} }
  function dayGroup(kind, day){
    var k = kind+day;
    if(!m._dayG[k]){ m._dayG[k] = L.layerGroup(); }
    return m._dayG[k];
  }
  function showDay(day, on){
    ['eau','velo'].forEach(function(kind){
      var host = (kind==='eau') ? gEau : gVelo;
      var g = m._dayG[kind+day];
      if(!g) return;
      if(on){ if(!host.hasLayer(g)) host.addLayer(g); }
      else  { if(host.hasLayer(g))  host.removeLayer(g); }
    });
    m._shown[day] = !!on;
    saveShown();
    tally(); paintDay(day);
  }
  m._showDay = showDay;

  function dayKey(kind, st){
    return 'bourgday-'+kind+'-'+(st.from.n+'_'+st.to.n)
           .replace(/[^A-Za-z0-9_]/g,'').slice(0,50);
  }
  function drawEau(wp, day){
    var stl = WSTYLE[wp[2]] || WSTYLE.tap;
    L.marker([wp[0],wp[1]],{icon:dotIcon(stl.ico, stl.col)}).addTo(dayGroup('eau', day))
     .bindPopup('<b>'+(wp[3]||stl.lab)+'</b><br><span style="font-size:.85em">'+stl.lab+'</span>'
       +'<br><a href="https://www.google.com/maps?q='+wp[0]+','+wp[1]+'" target="_blank" rel="noopener">Maps</a>');
  }
  function drawVelo(vp, day){
    var stl = VSTYLE[vp[2]] || VSTYLE.bike;
    L.marker([vp[0],vp[1]],{icon:dotIcon(stl.ico, stl.col)}).addTo(dayGroup('velo', day))
     .bindPopup('<b>'+(vp[3]||stl.lab)+'</b><br><span style="font-size:.85em">'+stl.lab+'</span>'
       +(vp[4]?'<br><a href="tel:'+vp[4].replace(/\s/g,'')+'">'+vp[4]+'</a>':'')
       +'<br><a href="https://www.google.com/maps?q='+vp[0]+','+vp[1]+'" target="_blank" rel="noopener">Maps</a>');
  }
  function tally(){
    var ne=0, nv=0;
    gEau.eachLayer(function(g){ if(g.eachLayer){ g.eachLayer(function(){ ne++; }); } else { ne++; } });
    gVelo.eachLayer(function(g){ if(g.eachLayer){ g.eachLayer(function(){ nv++; }); } else { nv++; } });
    var ce=document.getElementById('cnt-eau'); if(ce) ce.textContent = ne;
    var cv=document.getElementById('cnt-velo'); if(cv) cv.textContent = nv;
  }
  function paintDay(day){
    var b = document.querySelector('.dbtn[data-day="'+day+'"]');
    if(!b) return;
    var st = m._dayState[day]||'';
    if(st==='ok'){ b.className = 'dbtn ' + (m._shown[day]===false ? 'off' : 'ok'); }
    else { b.className = 'dbtn ' + st; }
  }
  m._tallyDays = function(){
    var kinds = [];
    if(LAYERS.eau)  kinds.push('eau');
    if(LAYERS.velo) kinds.push('velo');
    rides.forEach(function(st){
      if(m._dayState[st.day]==='load') return;      /* en cours : on n'y touche pas */
      if(!kinds.length){ m._dayState[st.day]=''; paintDay(st.day); return; }
      /* une journée n'est « chargée » que si TOUTES les couches actives le sont */
      var done = true;
      kinds.forEach(function(k){
        if(localStorage.getItem(dayKey(k, st))===null){ done = false; }
      });
      m._dayState[st.day] = done ? 'ok' : '';
      paintDay(st.day);
    });
  };

  /* Charge une journée : au plus 2 petites requêtes (eau, vélocistes). */
  m._loadDay = function(day, silent, done){
    var st = null;
    rides.forEach(function(x){ if(x.day===day) st = x; });
    if(!st){ if(done) done(false); return; }
    if(m._dayState[day]==='load'){ if(done) done(false); return; }
    m._dayState[day]='load'; paintDay(day);
    var stat = document.getElementById('eau-stat');
    function note(t){ if(stat && !silent){ stat.style.display='block'; stat.textContent=t; } }

    var kinds = [];
    if(LAYERS.eau)  kinds.push('eau');
    if(LAYERS.velo) kinds.push('velo');
    if(!kinds.length){ m._dayState[day]=''; paintDay(day); if(done) done(false); return; }

    var ki = 0, anyFail = false;
    (function nextKind(){
      if(ki >= kinds.length){
        m._dayState[day] = anyFail ? 'fail' : 'ok';
        if(!anyFail){ showDay(day, true); }
        paintDay(day); tally();
        note(anyFail ? ('J'+day+' : échec, retouche le bouton pour réessayer')
                     : ('J'+day+' chargé \u00b7 conservé hors ligne'));
        if(done) done(!anyFail);
        return;
      }
      var kind = kinds[ki], KEY = dayKey(kind, st);
      var cached = null;
      try{ cached = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
      if(cached){
        cached.forEach(function(r){ (kind==='eau'?drawEau:drawVelo)(r, day); });
        ki++; nextKind(); return;
      }
      note('J'+day+' \u2014 '+(kind==='eau'?'points d\u2019eau':'vélocistes')+'\u2026');
      withRoute(st, function(){
        var line = routeLine(st);
        var bb = bboxOf(line, kind==='eau' ? 0.03 : 0.06).join(',');
        var q = (kind==='eau')
          ? ('[out:json][timeout:45];('
             + 'node["amenity"="drinking_water"]('+bb+');'
             + 'node["man_made"="water_tap"]["drinking_water"!="no"]('+bb+');'
             + 'node["amenity"="water_point"]('+bb+');'
             + 'nwr["landuse"="cemetery"]('+bb+');'
             + ');out center 250;')
          : ('[out:json][timeout:45];('
             + 'nwr["shop"="bicycle"]('+bb+');'
             + 'nwr["name"~"Decathlon",i]('+bb+');'
             + ');out center 120;');
        overpassQuery(q, function(j){
          if(!j){ anyFail = true; ki++; setTimeout(nextKind, 500); return; }
          var out = [], seen = {};
          var maxM = (kind==='eau') ? WATER_MAX_M : VELO_MAX_M;
          (j.elements||[]).forEach(function(e){
            var la = e.lat!=null ? e.lat : (e.center && e.center.lat);
            var lo = e.lon!=null ? e.lon : (e.center && e.center.lon);
            if(la==null || lo==null) return;
            var t = e.tags||{};
            var rec = null;
            if(kind==='eau'){
              var k2 = (t.amenity==='drinking_water' || t.man_made==='water_tap') ? 'tap'
                     : (t.amenity==='water_point' ? 'point'
                     : (t.landuse==='cemetery' ? 'cim' : null));
              if(!k2) return;
              rec = [+la.toFixed(5), +lo.toFixed(5), k2, (t.name||'').replace(/[<>&"]/g,' ').slice(0,40)];
            }else{
              var nm = (t.name||'').trim();
              var isD = /decathlon/i.test(nm) || /decathlon/i.test(t.brand||'');
              if(!isD && t.shop!=='bicycle') return;
              rec = [+la.toFixed(5), +lo.toFixed(5), isD?'deca':'bike',
                     nm.replace(/[<>&"]/g,' ').slice(0,40),
                     (t.phone||t['contact:phone']||'').replace(/[<>&"]/g,' ').slice(0,20)];
            }
            var id = la.toFixed(4)+','+lo.toFixed(4);
            if(seen[id]) return;
            if(distToLine([la,lo], line) > maxM) return;
            seen[id] = 1;
            out.push(rec);
          });
          try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){}
          out.forEach(function(r){ (kind==='eau'?drawEau:drawVelo)(r, day); });
          tally();
          ki++;
          setTimeout(nextKind, 800);
        }, note);
      });
    })();
  };

  /* Charge toutes les journées à la file, en s'arrêtant si ça bloque. */
  m._loadAllDays = function(){
    var i = 0, consecFail = 0;
    var stat = document.getElementById('eau-stat');
    (function next(){
      if(i >= rides.length){
        if(stat){ stat.style.display='block'; stat.textContent = 'Chargement terminé.'; }
        return;
      }
      var day = rides[i].day;
      if(m._dayState[day]==='ok'){ i++; next(); return; }
      m._loadDay(day, false, function(okDay){
        consecFail = okDay ? 0 : consecFail+1;
        i++;
        if(consecFail >= 2){
          if(stat){ stat.style.display='block';
            stat.textContent = 'Interrompu : les serveurs refusent. Reprends jour par jour dans un moment.'; }
          return;
        }
        setTimeout(next, 2500);
      });
    })();
  };

  if(LAYERS.camps)  gCamps.addTo(m);
  if(LAYERS.bains)  gBains.addTo(m);
  if(LAYERS.eau)  gEau.addTo(m);
  if(LAYERS.velo) gVelo.addTo(m);
  setTimeout(function(){
    /* réaffiche sans réseau tout ce qui est déjà en cache */
    rides.forEach(function(st){
      var any = false;
      if(LAYERS.eau){
        try{ var ce=JSON.parse(localStorage.getItem(dayKey('eau',st))||'null');
             if(ce){ ce.forEach(function(r){ drawEau(r, st.day); }); any = true; } }catch(e){}
      }
      if(LAYERS.velo){
        try{ var cv=JSON.parse(localStorage.getItem(dayKey('velo',st))||'null');
             if(cv){ cv.forEach(function(r){ drawVelo(r, st.day); }); any = true; } }catch(e){}
      }
      if(any){ showDay(st.day, m._shown[st.day] !== false); }
    });
    /* rattache les groupes selon l'état d'affichage mémorisé */
    rides.forEach(function(st){
      var has = (m._dayG['eau'+st.day] || m._dayG['velo'+st.day]);
      if(has){ showDay(st.day, m._shown[st.day] !== false); }
    });
    tally(); m._tallyDays();
  }, 60);

  var cc = document.getElementById('cnt-camps'); if(cc) cc.textContent = nCamps;
  var cb = document.getElementById('cnt-bains'); if(cb) cb.textContent = nBains;

  /* La taille du conteneur n'est pas encore connue au moment du rendu :
     il faut invalidateSize() AVANT fitBounds(), sinon Leaflet calcule le
     zoom sur une taille fausse et la carte reste zoomée sur le centre. */
  m._allBounds = all.length ? L.latLngBounds(all) : null;
  function fitAll(){
    if(!m._container || !m._container.parentNode || maps.apercu!==m) return;   /* carte remplacée */
    try{
      m.invalidateSize();
      if(m._allBounds && !m._userMoved){ m.fitBounds(m._allBounds, {padding:[24,24]}); }
    }catch(e){}
  }
  fitAll();
  setTimeout(fitAll, 160);
  setTimeout(fitAll, 600);
  m.on('zoomstart dragstart', function(){ m._userMoved = true; });

  /* affinage progressif du tracé, séquentiel pour ménager le serveur */
  (function next(i){
    if(i>=rides.length) return;
    getRoute(rides[i], function(co){
      if(co){
        ROUTED[rides[i].id] = co;
        /* même mesure que sur la fiche d'étape : une seule source de vérité */
        if(applyRealKm(rides[i], co)){ refreshKmDisplay(); }
        /* le tracé réel remplace le trait provisoire : un seul trait à l'écran */
        if(sketch[rides[i].id]){ gTrace.removeLayer(sketch[rides[i].id]); delete sketch[rides[i].id]; }
        L.polyline(co.map(function(c){return [c[0],c[1]];}),{color:rides[i].color,weight:3,opacity:.95}).addTo(gTrace)
         .bindTooltip('J'+rides[i].day+' \u00b7 '+rides[i].from.n+' \u2192 '+rides[i].to.n+' \u00b7 '+kmLabel(rides[i]));
      }
      setTimeout(function(){ next(i+1); }, co ? 120 : 900);
    });
  })(0);
}

function toggleLayer(key, on){
  LAYERS[key] = on; saveLayers();
  var m = maps.apercu;
  if(!m || !m._g) return;
  var g = m._g[key];
  if(!g) return;
  if(on){
    g.addTo(m);
    var dw = document.getElementById('day-wrap');
    if(dw){ dw.style.display = (LAYERS.eau || LAYERS.velo) ? 'block' : 'none'; }
    if(m._tallyDays) m._tallyDays();
  } else {
    m.removeLayer(g);
    var st1 = document.getElementById('eau-stat');
    if(key==='eau' && st1){ st1.style.display='none'; }
    var st3 = document.getElementById('velo-stat');
    if(key==='velo' && st3){ st3.style.display='none'; }
  }
}


/* =========================================================
   REQUÊTES OVERPASS — une seule par couche, pour tout le parcours
   Les 17 requêtes rapprochées d'avant déclenchaient le quota
   d'Overpass (429/504) : le chargement s'arrêtait en cours de
   route. On utilise maintenant le filtre (around: rayon, liste de
   coordonnées) introduit en 0.7.55, qui filtre le corridor côté
   serveur, avec réessais espacés et bascule sur un miroir.
   ========================================================= */
var OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.osm.jp/api/interpreter',
  'https://overpass.osm.ch/api/interpreter'
];

/* UNE SEULE file d'attente, tous appelants confondus. Overpass n'accorde que
   deux créneaux par IP : deux couches interrogées en parallèle se faisaient
   refuser mutuellement. */
var OQ = {busy:false, list:[]};
/* Alias : point d'entrée unique, la file sérialise et espace les requêtes. */
function overpassQuery(q, onDone, onNote){ overpassQueue(q, onDone, onNote); }
function overpassQueue(q, onDone, onNote){
  OQ.list.push({q:q, onDone:onDone, onNote:onNote});
  overpassPump();
}
function overpassPump(){
  if(OQ.busy || !OQ.list.length) return;
  OQ.busy = true;
  var job = OQ.list.shift();
  var released = false;
  function release(){
    if(released) return;
    released = true;
    setTimeout(function(){ OQ.busy = false; overpassPump(); }, 1200);
  }
  /* Chien de garde : si le traitement d'une réponse plante ou ne rend jamais la
     main, la file restait bloquée pour toujours — la 1re requête passait et
     toutes les suivantes attendaient en silence. */
  var wd = setTimeout(function(){ release(); }, 120000);
  overpassRun(job.q, function(j){
    clearTimeout(wd);
    try{ job.onDone(j); }
    catch(e){ console.error('Overpass onDone:', e); }
    finally{ release(); }
  }, job.onNote);
}
function overpassRun(q, onDone, onNote){
  /* Stratégie : on essaie TOUS les miroirs d'affilée, sans attendre, avant de
     patienter. Un serveur saturé répond en une seconde ; inutile de perdre
     30 s sur lui alors qu'un autre est peut-être libre. Ce n'est qu'après un
     tour complet infructueux qu'on temporise. */
  var round = 0, idx = 0, lastWhy = '';
  function go(){
    var base = OVERPASS[idx];
    var useGet = q.length < 6000;
    var opts = useGet ? undefined : {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data='+encodeURIComponent(q)
    };
    var url = useGet ? (base + '?data=' + encodeURIComponent(q)) : base;
    var why = '';
    var host = base.split('/')[2];
    fetch(url, opts)
    .then(function(r){
      if(r.status===429 || r.status===503 || r.status===504){ why='saturé'; throw new Error('q'); }
      if(!r.ok){ why='erreur '+r.status; throw new Error('h'); }
      return r.json();
    })
    .then(function(j){
      if(j && j.remark && /error|timed out|exceeded/i.test(j.remark)){ why='requête trop lourde'; throw new Error('r'); }
      onDone(j);
    })
    .catch(function(){
      if(!why){ why = 'injoignable'; }
      lastWhy = why;
      idx++;
      if(idx < OVERPASS.length){
        if(onNote){ onNote(host+' '+why+' \u2014 essai sur un autre serveur\u2026'); }
        setTimeout(go, 400);                     /* miroir suivant, tout de suite */
        return;
      }
      idx = 0; round++;
      if(round >= 3){
        if(onNote){ onNote('Les '+OVERPASS.length+' serveurs OpenStreetMap sont indisponibles ('+lastWhy+'). Touche « Réessayer » plus tard, de préférence en wifi.'); }
        onDone(null);
        return;
      }
      var wait = round===1 ? 8000 : 25000;
      if(onNote){ onNote('Tous les serveurs occupés \u2014 nouvelle salve dans '+Math.round(wait/1000)+' s (tour '+(round+1)+'/3)\u2026'); }
      setTimeout(go, wait);
    });
  }
  go();
}




/* =========================================================
   POINTS D'EAU POTABLE — données OpenStreetMap en direct
   Interrogés par étape, filtrés à 2 km maximum du tracé,
   puis mis en cache pour rester disponibles hors ligne.
   ========================================================= */
var WATER_MAX_M = 2000;          /* détour maximal accepté */
var WSTYLE = {
  tap:  {ico:'\ud83d\udeb0', col:'#2a7fd4', lab:'Eau potable (OSM)'},
  point:{ico:'\ud83d\udca6', col:'#4aa3e0', lab:'Point d\u2019eau / aire de service'},
  cim:  {ico:'\u271d\ufe0f',  col:'#9fc48f', lab:'Cimetière \u2014 robinet quasi systématique'}
};
function waterKey(st){ return 'bourgwater-'+GEN+'-'+st.id+'-'+Math.round(st.km); }

function routeLine(st){
  var co = ROUTED[st.id];
  if(co && co.length>1){ return co.map(function(c){ return [c[0],c[1]]; }); }
  /* Repli : les villages-étapes seuls ne suffisent pas — on interpole tous les
     300 m, sinon la distance au « tracé » n'a aucun sens entre deux villages. */
  return densify(st.pts.map(function(p){ return p.ll; }), 300);
}
function densify(line, stepM){
  if(line.length < 2) return line;
  var out = [line[0]];
  for(var i=1;i<line.length;i++){
    var a = line[i-1], b = line[i];
    var n = Math.max(1, Math.ceil(distM(a,b)/stepM));
    for(var k=1;k<=n;k++){
      out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
    }
  }
  return out;
}
/* Garantit que le tracé routé est disponible avant d'interroger les POI :
   sans lui, le corridor est faux et le résultat serait mis en cache tel quel. */
function withRoute(st, cb){
  if(ROUTED[st.id] && ROUTED[st.id].length>1){ cb(true); return; }
  getRoute(st, function(co){
    if(co){ ROUTED[st.id] = co; }
    cb(!!co);
  });
}
/* distance minimale d'un point au tracé, en mètres */
/* Distance d'un point au SEGMENT [a,b], et non au sommet le plus proche.
   BRouter ne place un point qu'aux nœuds OSM : sur un halage rectiligne ils
   peuvent être à plusieurs centaines de mètres. Mesurer la distance au sommet
   le plus proche faisait donc croire qu'on était « hors du tracé » alors
   qu'on roulait exactement dessus. */
/* Géométrie point/segment. Renvoie une DISTANCE EN MÈTRES (un nombre) :
   deux versions incompatibles coexistaient, l'une renvoyant un objet, ce qui
   faisait échouer silencieusement toutes les comparaisons de distance. */
function segCalc(p, a, b){
  var latRef = (a[0]+b[0])/2 * Math.PI/180;
  var kx = 111320*Math.cos(latRef), ky = 110540;
  var ax = a[1]*kx, ay = a[0]*ky;
  var bx = b[1]*kx, by = b[0]*ky;
  var px = p[1]*kx, py = p[0]*ky;
  var dx = bx-ax, dy = by-ay;
  var L2 = dx*dx + dy*dy;
  var t = L2 ? ((px-ax)*dx + (py-ay)*dy) / L2 : 0;
  if(t < 0) t = 0; else if(t > 1) t = 1;
  var cx = ax + t*dx, cy = ay + t*dy;
  return {d: Math.sqrt((px-cx)*(px-cx) + (py-cy)*(py-cy)), t: t};
}
function distToSeg(p, a, b){ return segCalc(p, a, b).d; }
function segFrac(p, a, b){ return segCalc(p, a, b).t; }
function distToLine(pt, line){
  if(line.length===1){ return distM(pt, line[0]); }
  var best = Infinity;
  for(var i=0;i<line.length-1;i++){
    var r = distToSeg(pt, line[i], line[i+1]);
    if(r < best){ best = r; if(best < 20) return best; }
  }
  return best;
}
function bboxOf(line, pad){
  var la=[], lo=[];
  line.forEach(function(p){ la.push(p[0]); lo.push(p[1]); });
  return [Math.min.apply(null,la)-pad, Math.min.apply(null,lo)-pad,
          Math.max.apply(null,la)+pad, Math.max.apply(null,lo)+pad];
}
/* Récupère les points d'eau d'une étape. cb(list|null, source) */
function getWater(st, cb){
  var key = waterKey(st);
  try{
    var c = localStorage.getItem(key);
    if(c){ cb(JSON.parse(c), 'cache'); return; }
  }catch(e){}
  withRoute(st, function(routed){ getWaterInner(st, key, routed, cb); });
}
function getWaterInner(st, key, routed, cb){
  var line = routeLine(st);
  var bb = bboxOf(line, 0.04);
  var q = '[out:json][timeout:50];('
    + 'node["amenity"="drinking_water"]('+bb.join(',')+');'
    + 'node["man_made"="water_tap"]["drinking_water"!="no"]('+bb.join(',')+');'
    + 'node["amenity"="water_point"]('+bb.join(',')+');'
    + 'nwr["landuse"="cemetery"]('+bb.join(',')+');'
    + ');out center 800;';
  fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q))
   .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
   .then(function(j){
     var out = [];
     (j.elements||[]).forEach(function(e){
       var la = e.lat!=null ? e.lat : (e.center && e.center.lat);
       var lo = e.lon!=null ? e.lon : (e.center && e.center.lon);
       if(la==null || lo==null) return;
       var t = e.tags||{};
       var kind = t.amenity==='drinking_water' || t.man_made==='water_tap' ? 'tap'
                : (t.amenity==='water_point' ? 'point'
                : (t.landuse==='cemetery' ? 'cim' : null));
       if(!kind) return;
       var d = distToLine([la,lo], line);
       if(d > WATER_MAX_M) return;                       /* détour > 2 km : écarté */
       out.push([+la.toFixed(5), +lo.toFixed(5), kind, Math.round(d),
                 (t.name||'').replace(/[<>&"]/g,' ').slice(0,40)]);
     });
     out.sort(function(a,b){ return a[3]-b[3]; });
     out = out.slice(0,150);
     if(routed){ try{ localStorage.setItem(key, JSON.stringify(out)); }catch(e){} }
     cb(out, 'live');
   })
   .catch(function(){ cb(null,'fail'); });
}



/* ---------------------------------------------------------
   VÉLOCISTES & DECATHLON (OpenStreetMap)
   shop=bicycle · enseignes Decathlon (shop=sports / brand)
   Rayon élargi à 5 km : pour une réparation, le détour vaut
   le coup bien au-delà des 2 km des points d'eau.
   --------------------------------------------------------- */
var VELO_MAX_M = 5000;
var VSTYLE = {
  bike: {ico:'\ud83d\udd27', col:'#e07b39', lab:'Vélociste'},
  deca: {ico:'\ud83c\udfea', col:'#1d5fa8', lab:'Decathlon'}
};
/* cap (azimut) de a vers b, en degrés 0..360 */
function bearing(a, b){
  var la1 = a[0]*Math.PI/180, la2 = b[0]*Math.PI/180;
  var dLo = (b[1]-a[1])*Math.PI/180;
  var y = Math.sin(dLo)*Math.cos(la2);
  var x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(dLo);
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}
function angleDiff(a, b){
  var d = ((b - a + 540) % 360) - 180;
  return d;                     /* négatif = gauche, positif = droite */
}
/* distances cumulées le long du tracé */
function cumDist(co){
  var c = [0];
  for(var i=1;i<co.length;i++){ c.push(c[i-1] + distM(co[i-1], co[i])); }
  return c;
}
/* cap moyen sur `span` mètres avant / après l'indice i */
function bearingAround(co, cum, i, span, forward){
  var j = i;
  if(forward){
    while(j < co.length-1 && cum[j]-cum[i] < span){ j++; }
    if(j === i) return null;
    return bearing(co[i], co[j]);
  }
  while(j > 0 && cum[i]-cum[j] < span){ j--; }
  if(j === i) return null;
  return bearing(co[j], co[i]);
}
var TURN = {
  sharpL:{ico:'\u21b0', lab:'Tourner franchement à gauche'},
  left:  {ico:'\u2190', lab:'Tourner à gauche'},
  slightL:{ico:'\u2196', lab:'Légèrement à gauche'},
  slightR:{ico:'\u2197', lab:'Légèrement à droite'},
  right: {ico:'\u2192', lab:'Tourner à droite'},
  sharpR:{ico:'\u21b1', lab:'Tourner franchement à droite'},
  start: {ico:'\u25b6', lab:'Départ'},
  end:   {ico:'\ud83c\udfc1', lab:'Arrivée'}
};
function classify(d){
  var a = Math.abs(d);
  if(a >= 115) return d<0 ? 'sharpL' : 'sharpR';
  if(a >= 60)  return d<0 ? 'left'   : 'right';
  return d<0 ? 'slightL' : 'slightR';
}
/* Détecte les virages : on compare le cap 30 m avant et 30 m après chaque
   point. Un simple changement de cap point à point produirait des dizaines
   de faux virages sur un halage sinueux ; la fenêtre lisse les méandres. */
function buildTurns(co){
  var cum = cumDist(co);
  var raw = [];
  for(var i=3;i<co.length-3;i++){
    var b1 = bearingAround(co, cum, i, 30, false);
    var b2 = bearingAround(co, cum, i, 30, true);
    if(b1===null || b2===null) continue;
    var d = angleDiff(b1, b2);
    if(Math.abs(d) < 32) continue;               /* virage trop doux */
    raw.push({i:i, d:d, m:cum[i]});
  }
  /* fusionne les points d'un même virage (moins de 45 m d'écart) */
  var turns = [], k = 0;
  while(k < raw.length){
    var j = k, best = k;
    while(j+1 < raw.length && raw[j+1].m - raw[j].m < 45){
      j++;
      if(Math.abs(raw[j].d) > Math.abs(raw[best].d)) best = j;
    }
    /* angle réel du virage : cap AVANT l'entrée vs cap APRÈS la sortie.
       Additionner les diffs de chaque point les compterait plusieurs fois,
       les fenêtres de 30 m se chevauchant. */
    var bIn  = bearingAround(co, cum, raw[k].i, 30, false);
    var bOut = bearingAround(co, cum, raw[j].i, 30, true);
    var tot = (bIn!==null && bOut!==null) ? angleDiff(bIn, bOut) : raw[best].d;
    if(Math.abs(tot) >= 38){                     /* le virage doit être net */
      turns.push({i:raw[best].i, m:raw[best].m, d:tot, k:classify(tot)});
    }
    k = j+1;
  }
  return {turns:turns, cum:cum, total:cum[cum.length-1]};
}
/* Distance d'un point au SEGMENT [a,b] (et non au sommet le plus proche).
   Avec un tracé échantillonné tous les 50 m, ne mesurer que vers les sommets
   surestimait l'écart de plusieurs dizaines de mètres — de quoi déclencher une
   fausse alerte « hors du tracé » alors qu'on roule dessus. */
/* Projette une position sur le tracé : indice le plus proche + écart réel */
function projectOn(co, pt, hintIdx){
  function scan(from, to){
    var bi = from, bd = Infinity;
    for(var i=from;i<to-1;i++){
      var d = distToSeg(pt, co[i], co[i+1]);
      if(d < bd){ bd = d; bi = i; }
    }
    return {i:bi, d:bd};
  }
  var r;
  if(hintIdx!=null){
    r = scan(Math.max(0, hintIdx-200), Math.min(co.length, hintIdx+500));
    /* seuil de reprise abaissé : au-delà de 60 m, on rebalaie tout le tracé
       plutôt que de faire confiance à une fenêtre peut-être périmée */
    if(r.d <= 60) return r;
  }
  var full = scan(0, co.length);
  return (r && r.d < full.d) ? r : full;
}
var GUIDON = {active:false, id:null, wl:null, headUp:false, hdg:0, shown:0};
try{ GUIDON.headUp = localStorage.getItem('bourg-headup')==='1'; }catch(e){}

/* Cap courant : celui du GPS s'il est fourni, sinon calculé entre deux points
   successifs (plus fiable à vélo, le cap GPS étant souvent absent à l'arrêt). */
function navHeading(pos){
  if(pos && pos.heading!=null && !isNaN(pos.heading) && pos.speed>0.7){
    return pos.heading;
  }
  if(GUIDON.prevPt && pos){
    var d = distM([GUIDON.prevPt.lat, GUIDON.prevPt.lng], [pos.lat, pos.lng]);
    if(d > 8){ return bearing([GUIDON.prevPt.lat, GUIDON.prevPt.lng], [pos.lat, pos.lng]); }
  }
  return null;
}
/* Applique la rotation, en lissant pour éviter que la carte tremble. */
function applyRotation(){
  var el = GUIDON.id ? document.getElementById('map-'+GUIDON.id) : null;
  var m  = GUIDON.id ? maps[GUIDON.id] : null;
  if(!el) return;
  if(!GUIDON.headUp){
    el.classList.remove('maprot');
    el.style.transform = '';
    el.style.removeProperty('--rotd'); el.style.removeProperty('--rotx'); el.style.removeProperty('--roty');
    GUIDON.rotD = 0;
    el.style.setProperty('--counter','0deg');
    if(m && m.dragging){ m.dragging.enable(); }
    return;
  }
  /* L'élément est porté à la taille de la DIAGONALE de l'écran et recentré :
     en tournant, ses coins ne peuvent plus laisser de zone vide. Un simple
     scale() aurait fallu 2,2× sur un écran de téléphone, donc un zoom énorme. */
  if(!el.classList.contains('maprot')){
    el.classList.add('maprot');
    var vw = window.innerWidth, vh = window.innerHeight;
    var D = Math.ceil(Math.sqrt(vw*vw + vh*vh));
    el.style.setProperty('--rotd', D+'px');
    el.style.setProperty('--rotx', Math.round((vw-D)/2)+'px');
    el.style.setProperty('--roty', Math.round((vh-D)/2)+'px');
    GUIDON.rotD = D;
    /* Leaflet doit reprendre la mesure : sans cela il croit encore faire la
       taille de l'écran et centre la vue à côté — la carte semblait ne pas
       suivre la position. */
    if(m){ setTimeout(function(){ try{ m.invalidateSize(false); if(m._lastFix && m._follow){ m.setView(m._lastFix, m.getZoom()); } }catch(e){} }, 40); }
    if(m){ setTimeout(function(){ m.invalidateSize(); }, 40); }
  }
  var target = -GUIDON.hdg;
  var diff = ((target - GUIDON.shown + 540) % 360) - 180;
  GUIDON.shown = GUIDON.shown + diff*0.35;          /* lissage */
  el.style.transform = 'rotate('+GUIDON.shown.toFixed(1)+'deg)';
  el.style.setProperty('--counter', (-GUIDON.shown).toFixed(1)+'deg');
}
function setHeadUp(on){
  GUIDON.headUp = !!on;
  /* La rotation est purement visuelle (CSS) : Leaflet continue de raisonner
     dans un repère non tourné. Un glisser du doigt serait donc appliqué de
     travers, voire à l'envers quand on roule vers le sud. Plutôt que de laisser
     une carte qui part dans le mauvais sens, on désactive le déplacement manuel
     en mode CAP — la carte suit le GPS — et on le rétablit en mode NORD. */
  var mm0 = GUIDON.id ? maps[GUIDON.id] : null;
  if(mm0 && mm0.dragging){
    if(on){ mm0.dragging.disable(); } else { mm0.dragging.enable(); }
  }
  try{ localStorage.setItem('bourg-headup', on?'1':'0'); }catch(e){}
  var c = document.querySelector('.navcompass');
  if(c){
    c.className = 'navcompass' + (on?' head':'');
    c.innerHTML = '<span class="cico">'+(on?'\u27a4':'\u2b06')+'</span><span>'+(on?'CAP':'NORD')+'</span>';
    c.title = on ? 'Cap en haut — déplacement manuel désactivé (la carte suit le GPS). Touche pour repasser au Nord.'
                 : 'Nord en haut — tu peux déplacer la carte. Touche pour orienter selon ta direction.';
  }
  if(!on){ GUIDON.shown = 0; }
  applyRotation();
  /* en mode CAP la carte doit rester verrouillée sur la position */
  var mm0 = GUIDON.id ? maps[GUIDON.id] : null;
  if(mm0 && on){ recenter(mm0); }
  var m = GUIDON.id ? maps[GUIDON.id] : null;
  if(m){
    /* En mode CAP, la carte est tournée en CSS : un glissement du doigt ne
       correspondrait plus aux axes de la carte et le déplacement partirait de
       travers. On verrouille donc la carte sur la position, comme un GPS de
       voiture ; pour explorer librement, il suffit de repasser en NORD. */
    if(on){
      m.dragging.disable();
      m._follow = true;
      if(m._lastFix){ m._selfMove = true; m.setView(m._lastFix, Math.max(m.getZoom(),16)); }
    }else{
      m.dragging.enable();
    }
    setTimeout(function(){ m.invalidateSize(); }, 60);
  }
  var hint = document.getElementById('nav-hint');
  if(hint){ hint.textContent = on ? 'Carte verrouillée sur votre position \u2014 passez en NORD pour explorer' : ''; }
}
function enterGuidon(sid){
  /* Si un plein écran précédent n'a pas été refermé proprement (bouton retour
     d'Android, changement d'onglet, re-rendu), l'état restait « actif » et
     tout appui suivant était ignoré : la navigation devenait inaccessible. */
  if(GUIDON.active){ exitGuidon(); }
  var st = null;
  RUN.stages.forEach(function(x){ if(x.id===sid) st = x; });
  var box = document.getElementById('map-'+sid), m = maps[sid];
  if(!st || !box || !m) return;
  GUIDON.active = true; GUIDON.id = sid; GUIDON.st = st;

  var co = ROUTED[sid];
  GUIDON.nav = (co && co.length>10) ? buildTurns(co.map(function(c){ return [c[0],c[1]]; })) : null;
  GUIDON.co = co ? co.map(function(c){ return [c[0],c[1]]; }) : null;
  GUIDON.lastIdx = null;

  box.classList.add('guidon-fs');
  document.body.classList.add('noscroll');
  document.documentElement.classList.add('navmode');
  /* Pas d'API Fullscreen : elle n'affiche QUE l'élément mis en plein écran et
     ses descendants — nos bandeaux et boutons, posés sur <body> pour échapper
     à la rotation, disparaissaient. La classe .guidon-fs suffit (position
     fixe, plein écran), et en PWA installée il n'y a pas de barre navigateur
     à masquer de toute façon. */
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(function(x){ GUIDON.wl=x; }).catch(function(){});
  }
  recenter(m);        /* GPS + suivi, et le bouton reflète l'état */

  GUIDON.prevPt = null; GUIDON.hdg = 0; GUIDON.shown = 0;
  var bar = document.createElement('div');
  bar.className = 'navbar';
  bar.innerHTML =
     '<div class="navtop">'
    +  '<div class="navarrow" id="nav-arrow">\u25b6</div>'
    +  '<div class="navtxt"><b id="nav-dist">\u2014</b><span id="nav-lab">'
    +    (GUIDON.nav ? 'En attente du GPS\u2026' : 'Tracé non chargé \u2014 affiche la carte seule')+'</span></div>'
    +'</div>'
    +'<div class="navhint" id="nav-hint"></div>'
    +'<div class="navbot">'
    +  '<span id="nav-prog">J'+st.day+' \u00b7 '+esc(st.to.n)+'</span>'
    +  '<span id="nav-speed">\u2014</span>'
    +  '<button class="gexit" aria-label="Quitter la navigation">\u2715</button>'
    +'</div>';
  /* hors de l'élément carte : sinon la rotation ferait tourner le texte */
  document.body.appendChild(bar);
  GUIDON.bar = bar;
  bar.querySelector('.gexit').addEventListener('click', function(ev){
    ev.stopPropagation(); exitGuidon();
  });
  var attr = document.createElement('span');
  attr.className = 'navattr';
  attr.textContent = '© OpenStreetMap';
  bar.querySelector('.navbot').insertBefore(attr, bar.querySelector('.navbot .gexit'));

  var comp = document.createElement('button');
  comp.className = 'navcompass';
  comp.setAttribute('aria-label','Orientation de la carte');
  document.body.appendChild(comp);
  GUIDON.comp = comp;
  comp.addEventListener('click', function(ev){
    ev.stopPropagation(); setHeadUp(!GUIDON.headUp);
  });

  var loc = document.createElement('button');
  loc.className = 'navlocate' + (m._follow?' on':'');
  loc.innerHTML = '\u25c9';
  loc.setAttribute('aria-label','Revenir à ma position');
  document.body.appendChild(loc);
  GUIDON.locBtn = loc;
  loc.addEventListener('click', function(ev){
    ev.stopPropagation(); recenter(m);
    loc.className = 'navlocate' + (m._follow?' on':'');
  });

  setHeadUp(GUIDON.headUp);
  setTimeout(function(){ m.invalidateSize(); },250);
  navUpdate();
}

/* Met à jour l'affichage à chaque point GPS */
function navUpdate(pos){
  if(!GUIDON.active) return;
  var elA = document.getElementById('nav-arrow');
  var elD = document.getElementById('nav-dist');
  var elL = document.getElementById('nav-lab');
  var elP = document.getElementById('nav-prog');
  var elS = document.getElementById('nav-speed');
  if(!elA) return;

  if(pos && pos.speed!=null && pos.speed>=0 && elS){
    elS.textContent = (pos.speed*3.6).toFixed(0)+' km/h';
  }
  if(pos){
    var hd = navHeading(pos);
    if(hd!==null){ GUIDON.hdg = hd; }
    GUIDON.prevPt = {lat:pos.lat, lng:pos.lng};
    applyRotation();
    if(GUIDON.locBtn){
      var mm = maps[GUIDON.id];
      GUIDON.locBtn.className = 'navlocate' + (mm && mm._follow?' on':'');
    }
  }
  if(!GUIDON.nav || !GUIDON.co){ return; }
  if(!pos){ return; }

  var nav = GUIDON.nav, co = GUIDON.co;
  var pr = projectOn(co, [pos.lat, pos.lng]);
  GUIDON.lastIdx = pr.i;

  /* Hors tracé : le seuil s'adapte à la précision GPS annoncée. Sous les
     arbres du halage elle dépasse souvent 30 m, ce qui provoquait des alertes
     alors qu'on roulait exactement sur le tracé. */
  var tol = Math.max(90, (pos.accuracy||0) * 2.5);
  if(pr.d > tol){
    elA.textContent = '\u26a0';
    elA.className = 'navarrow warn';
    elD.textContent = Math.round(pr.d)+' m';
    elL.textContent = 'Écart au tracé';
    if(elP){ elP.textContent = 'J'+GUIDON.st.day+' \u00b7 revenir vers le tracé'; }
    return;
  }
  elA.className = 'navarrow';

  /* position exacte le long du tracé : sommet + fraction du segment en cours */
  var here = nav.cum[pr.i];
  if(pr.i < co.length-1 && pr.i < nav.cum.length-1){
    var frac = segFrac([pos.lat, pos.lng], co[pr.i], co[pr.i+1]);
    here += (nav.cum[pr.i+1] - nav.cum[pr.i]) * frac;
  }
  var next = null;
  for(var i=0;i<nav.turns.length;i++){
    if(nav.turns[i].m > here + 8){ next = nav.turns[i]; break; }
  }
  var restKm = Math.max(0, (nav.total - here)/1000);
  if(elP){ elP.textContent = 'J'+GUIDON.st.day+' \u00b7 '+restKm.toFixed(1)+' km \u2192 '+GUIDON.st.to.n; }

  if(!next){
    elA.textContent = TURN.end.ico;
    elD.textContent = restKm < 1 ? Math.round(restKm*1000)+' m' : restKm.toFixed(1)+' km';
    elL.textContent = 'Tout droit jusqu\u2019à l\u2019arrivée';
    return;
  }
  var dm = Math.round(next.m - here);
  var t = TURN[next.k];
  elA.textContent = t.ico;
  elD.textContent = dm >= 1000 ? (dm/1000).toFixed(1)+' km' : dm+' m';
  elL.textContent = t.lab + (GUIDON.off ? ' \u00b7 '+GUIDON.off+' m du tracé (autre rive ?)' : '');
  if(dm < 60){ elA.classList.add('soon'); } else { elA.classList.remove('soon'); }
}

function exitGuidon(){
  if(!GUIDON.active){ return; }
  try{ exitGuidonInner(); }
  catch(e){ /* quoi qu'il arrive, l'état doit être libéré */ }
  finally{
    GUIDON.active=false; GUIDON.id=null; GUIDON.nav=null; GUIDON.co=null; GUIDON.prevPt=null;
    document.body.classList.remove('noscroll');
    document.documentElement.classList.remove('navmode');
    ['bar','comp','locBtn'].forEach(function(k){
      if(GUIDON[k] && GUIDON[k].parentNode){ try{ GUIDON[k].parentNode.removeChild(GUIDON[k]); }catch(e){} }
      GUIDON[k] = null;
    });
    document.querySelectorAll('.navbar,.navcompass,.navlocate').forEach(function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    document.querySelectorAll('.guidon-fs').forEach(function(n){
      n.classList.remove('guidon-fs'); n.classList.remove('maprot'); n.style.transform='';
    });
  }
}
function exitGuidonInner(){
  var box = document.getElementById('map-'+GUIDON.id), m = maps[GUIDON.id];
  if(box){
    box.classList.remove('guidon-fs');
    box.classList.remove('maprot');
    box.style.transform = '';
  }
  if(m && m.dragging){ m.dragging.enable(); }
  ['bar','comp','locBtn'].forEach(function(k){
    if(GUIDON[k] && GUIDON[k].parentNode){ GUIDON[k].parentNode.removeChild(GUIDON[k]); }
    GUIDON[k] = null;
  });
  document.body.classList.remove('noscroll');
  if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
  document.documentElement.classList.remove('navmode');
  if(m){ m._follow=false; setTimeout(function(){ m.invalidateSize(); },250); }
  if(GUIDON.wl){ try{ GUIDON.wl.release(); }catch(e){} GUIDON.wl=null; }
  GUIDON.active=false; GUIDON.id=null; GUIDON.nav=null; GUIDON.co=null; GUIDON.prevPt=null;
}

function officialBox(){

    +'<label class="vopt"><input type="checkbox" class="ochk" data-o="bouclage"'+(STATE.opts.bouclage?' checked':'')+'>'

function surfBar(surfs, total){
  var order = ['vv','halage','route'];
  var cols = {vv:'#6fd6c9', halage:'#f0b860', route:'#d98a4e'};
  var bar = '', leg = '';
  order.forEach(function(k){
    var v = surfs[k]||0;
    if(!v) return;
    bar += '<i style="width:'+(v/total*100).toFixed(1)+'%;background:'+cols[k]+'"></i>';
    leg += '<span><b style="color:'+cols[k]+'">\u25ac</b> '+SURF[k].lab+' '+Math.round(v)+' km</span>';
  });
  return '<div class="surfbar">'+bar+'</div><div class="surflegend">'+leg+'</div>';
}
function chainList(){
  var h = '<ul class="chain">';
  RUN.stages.forEach(function(st){
    if(st.type==='free'){
      h += '<li class="repos"><span class="dj">J'+st.day+'<i>'+st.dstr+'</i></span>'
        +'<span class="nm">Journée libre \u2014 boucle déjà refermée<i>'+esc(st.at.n)+'</i></span>'
        +'<span class="st">\u2014</span></li>';
      return;
    }
    if(st.type==='rest'){
      h += '<li class="repos" data-stage=""><span class="dj">J'+st.day+'<i>'+st.dstr+'</i></span>'
        +'<span class="nm">Journée de repos \u2014 '+esc(st.at.n)+'<i>'+esc(st.at.voir||'')+'</i></span>'
        +'<span class="st">\u2014</span></li>';
      return;
    }
    var via = st.via.length ? st.via.map(function(p){return p.n;}).join(' · ') : 'sans arrêt intermédiaire';
    h += '<li class="'+(st.confirmed?'okday':'')+'" data-stage="'+st.id+'" role="button" tabindex="0">'
      +'<span class="dj">J'+st.day+'<i>'+st.dstr+'</i></span>'
      +'<span class="nm">'+esc(st.from.n)+' \u2192 '+esc(st.to.n)+'<i>'+esc(via)+'</i></span>'
      +'<span class="st">'+kmLabel(st)
        +(st.applied===-1?'<br><span style="color:var(--aqua)">plus court</span>':'')
        +(st.applied===1?'<br><span style="color:var(--gold)">plus long</span>':'')
        +(st.forced?'<br><span style="color:var(--danger)">rattrapage</span>':'')
        +(st.confirmed?'<br><span style="color:var(--sage)">\u2713 fait</span>':'')
      +'</span></li>';
  });
  h += '</ul>';
  return h;
}
